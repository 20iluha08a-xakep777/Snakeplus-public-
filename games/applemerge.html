<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Apple Merge</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;padding:8px;gap:8px}.hud{display:flex;gap:14px;font-size:11px;letter-spacing:1px;color:rgba(200,220,255,.6);text-transform:uppercase}.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}.wrap{position:relative;display:flex}.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.94);border-radius:10px;gap:12px;padding:20px;text-align:center;z-index:10}.msg.show{display:flex}.msg h2{color:#7ee8b0;font-size:20px}.msg p{font-size:12px;color:rgba(200,220,255,.75);line-height:1.6}.msg button{font:inherit;font-size:13px;font-weight:700;padding:10px 22px;border:2px solid #7ee8b0;border-radius:8px;background:#7ee8b0;color:#06210f;cursor:pointer}</style></head><body>
<div class="hud"><span>Ур.<b id="lv">1</b></span><span>Очки<b id="sc">0</b></span><span>Цель<b id="goal">500</b></span><span>💰<b id="coins">0</b></span></div>
<div class="wrap"><canvas id="c" width="340" height="500"></canvas><div class="msg" id="msg"></div></div>
<script>(function(){const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');
const FRUITS=['🍒','🍓','🍇','🍊','🍎','🍉','👑'];
const RADII=[14,20,27,36,46,58,72];
const VALUES=[2,4,8,16,32,64,128];
let balls=[],score=0,level=Number(localStorage.getItem('apple_lv')||1),alive=true,nextDrop=0,dropX=c.width/2,canDrop=true,cdTimer=0;
let totalCoins=Number(localStorage.getItem('apple_coins')||0);
const goalFor=l=>100*l;
const dropable=()=>Math.min(4+Math.floor(level/2),6);
function init(){balls=[];score=0;alive=true;nextDrop=Math.floor(Math.random()*dropable());dropX=c.width/2;canDrop=true;cdTimer=0;render();}
function show(t,p,b,n){const m=$('msg');m.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';m.classList.add('show');const bt=document.createElement('button');bt.textContent=b;bt.onclick=()=>{m.classList.remove('show');n();};m.appendChild(bt);}
function drop(){if(!canDrop||!alive)return;balls.push({x:dropX,y:80,vx:0,vy:0,r:RADII[nextDrop],idx:nextDrop});nextDrop=Math.floor(Math.random()*dropable());canDrop=false;cdTimer=600;setTimeout(()=>{canDrop=true;},600);}
function step(dt){
const dtN=dt/16.67;
for(const b of balls){b.vy+=0.5*dtN;b.x+=b.vx*dtN;b.y+=b.vy*dtN;b.vx*=0.98;
if(b.x-b.r<0){b.x=b.r;b.vx=-b.vx*0.5;}if(b.x+b.r>c.width){b.x=c.width-b.r;b.vx=-b.vx*0.5;}
if(b.y+b.r>c.height-4){b.y=c.height-4-b.r;b.vy=-b.vy*0.3;b.vx*=0.9;}
}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
const a=balls[i],b=balls[j];const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy);const min=a.r+b.r;
if(d<min&&d>0.001){const nx=dx/d,ny=dy/d,overlap=(min-d)/2;
a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;
const relVx=a.vx-b.vx,relVy=a.vy-b.vy;const relV=relVx*nx+relVy*ny;
if(relV>0){const imp=relV*0.7;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny;}
if(a.idx===b.idx&&a.idx<FRUITS.length-1){a.idx++;a.r=RADII[a.idx];b.dead=true;score+=VALUES[a.idx];}
}}
balls=balls.filter(b=>!b.dead);
if(cdTimer>0)cdTimer-=dt;
if(balls.length>20){alive=false;checkLose();}
}
function checkLose(){for(const b of balls)if(b.y<60&&Math.abs(b.vy)<1&&b.idx<2){alive=false;level=1;localStorage.setItem('apple_lv',1);show('😔 Переполнение','Очки: '+score+'<br>Начинаем с 1-го','Заново',init);return;}}
function checkWin(){if(score>=goalFor(level)){const r=30+level*15;totalCoins+=r;localStorage.setItem('apple_coins',totalCoins);try{window.parent.postMessage({type:'addCoins',amount:r},'*');}catch(e){}level++;localStorage.setItem('apple_lv',level);show('🎉 Уровень пройден!','+'+r+'💰','Дальше',init);}}
function render(){
ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
ctx.strokeStyle='rgba(126,232,176,.3)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,80);ctx.lineTo(c.width,80);ctx.stroke();ctx.setLineDash([]);
for(const b of balls){ctx.font=(b.r*2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(FRUITS[b.idx],b.x,b.y);}
if(canDrop){ctx.font=(RADII[nextDrop]*2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(FRUITS[nextDrop],dropX,40);}
$('lv').textContent=level;$('sc').textContent=score;$('goal').textContent=goalFor(level);$('coins').textContent=totalCoins;
}
let last=0;function loop(t){if(!alive)return;const dt=Math.min(t-last,50);last=t;step(dt);checkWin();render();requestAnimationFrame(loop);}
c.addEventListener('touchstart',e=>{dropX=e.touches[0].clientX-((window.innerWidth-c.width)/2);dropX=Math.max(20,Math.min(c.width-20,dropX));});
c.addEventListener('touchend',()=>drop());
c.addEventListener('click',e=>{const rect=c.getBoundingClientRect();dropX=e.clientX-rect.left;drop();});
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();drop();}else if(e.key==='ArrowLeft')dropX=Math.max(20,dropX-20);else if(e.key==='ArrowRight')dropX=Math.min(c.width-20,dropX+20);});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='input'){if(d.act==='left')dropX=Math.max(20,dropX-20);else if(d.act==='right')dropX=Math.min(c.width-20,dropX+20);else if(d.act==='ok'||d.act==='a')drop();else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}}});
init();requestAnimationFrame(loop);})();</script></body></html>
