<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apple Merge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:10px;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;gap:8px}
.title{font-size:11px;letter-spacing:4px;color:rgba(200,220,255,.5);text-transform:uppercase}
.hud{width:min(94vw,380px);display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#9fb0d0}
.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}
canvas{width:min(94vw,380px);height:min(94vw,380px);border-radius:12px;background:#050a14;box-shadow:0 0 0 2px #2a3a5c,0 0 30px rgba(126,232,176,.15);touch-action:none;display:block}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;border:2px solid #7ee8b0;background:transparent;color:#7ee8b0;cursor:pointer;letter-spacing:1px}
button:active{background:#7ee8b0;color:#06210f}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
.dpad button{width:44px;height:44px;padding:0;font-size:16px;border-radius:10px;border:2px solid #2a3a5c;background:linear-gradient(180deg,#2a3a5c,#1a2540);color:#7ee8b0;display:flex;align-items:center;justify-content:center}
.dpad .sp{visibility:hidden}
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:24px;text-align:center}
.overlay.show{display:flex}
.overlay h2{color:#7ee8b0;font-size:22px;letter-spacing:3px}
.overlay p{color:#9fb0d0;font-size:13px;line-height:1.7}
.overlay b{color:#fff;font-size:16px}
</style>
</head>
<body>
<div class="title">Apple Merge</div>
<div class="hud"><span>СЧЁТ<b id="score">0</b></span><span>ТОП<b id="top">🍒</b></span><span>УР.<b id="lvl">1</b></span></div>
<canvas id="c" width="380" height="380"></canvas>
<div class="btns"><button id="bNew">Заново</button><button id="bExit">← Назад</button></div>
<div class="dpad">
<div class="sp"></div><button data-dir="up">▲</button><div class="sp"></div>
<button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
</div>
<div class="overlay" id="ov"><h2 id="ovT">Игра окончена</h2><p id="ovP"></p><button id="ovB">Ещё раз</button></div>
<script>
(function(){
'use strict';
const FRUITS=[
  {emoji:'🍒',val:2,color:'#c8304a'},
  {emoji:'🍓',val:4,color:'#e54a5c'},
  {emoji:'🍇',val:8,color:'#8a4fc7'},
  {emoji:'🍊',val:16,color:'#f08a20'},
  {emoji:'🍎',val:32,color:'#d63a2e'},
  {emoji:'🍉',val:64,color:'#2ea85c'},
  {emoji:'👑',val:128,color:'#ffc107'}
];
const LEVELS=[
  {cols:5,rows:7,spawnMax:1},
  {cols:5,rows:7,spawnMax:2},
  {cols:6,rows:8,spawnMax:2},
  {cols:6,rows:8,spawnMax:3},
  {cols:7,rows:9,spawnMax:3},
  {cols:7,rows:9,spawnMax:4}
];
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=380,H=380;
let cols,rows,CELL,OX,OY;
let grid,score,level,over,win,running,dropCol;
let hi=Number(localStorage.getItem('am_hi')||0);
function initLevel(lvl){
  level=lvl;
  const cfg=LEVELS[Math.min(lvl-1,LEVELS.length-1)];
  cols=cfg.cols;rows=cfg.rows;
  CELL=Math.min(W/cols,H/rows);
  OX=(W-cols*CELL)/2;OY=(H-rows*CELL)/2;
  grid=[];
  for(let y=0;y<rows;y++){grid[y]=[];for(let x=0;x<cols;x++)grid[y][x]=null;}
  score=0;over=false;win=false;running=true;dropCol=-1;
  updateHUD();
  document.getElementById('ov').classList.remove('show');
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lvl').textContent=level;
  let maxIdx=0;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x]&&grid[y][x].idx>maxIdx)maxIdx=grid[y][x].idx;
  document.getElementById('top').textContent=FRUITS[maxIdx].emoji;
  if(score>hi){hi=score;localStorage.setItem('am_hi',hi);}
}
function gravity(){
  for(let x=0;x<cols;x++){
    const col=[];
    for(let y=0;y<rows;y++)if(grid[y][x])col.push(grid[y][x]);
    for(let y=0;y<rows;y++)grid[y][x]=null;
    for(let i=0;i<col.length;i++)grid[rows-col.length+i][x]=col[i];
  }
}
function cascade(){
  let merged=true,safety=0;
  while(merged&&safety<100){
    merged=false;safety++;
    // bottom-up, left-right
    outer:
    for(let y=rows-1;y>=0;y--){
      for(let x=0;x<cols;x++){
        const c=grid[y][x];
        if(!c||c.idx>=FRUITS.length-1)continue;
        // check right and down
        for(const [dx,dy] of [[1,0],[0,1]]){
          const nx=x+dx,ny=y+dy;
          if(nx>=cols||ny>=rows)continue;
          const o=grid[ny][nx];
          if(o&&o.idx===c.idx){
            const ni=c.idx+1;
            score+=FRUITS[ni].val;
            grid[y][x]={idx:ni,born:performance.now()};
            grid[ny][nx]=null;
            gravity();
            merged=true;
            break outer;
          }
        }
      }
    }
  }
  updateHUD();
  // win?
  let maxIdx=0;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x]&&grid[y][x].idx>maxIdx)maxIdx=grid[y][x].idx;
  if(maxIdx===FRUITS.length-1&&!win){
    win=true;running=false;over=true;
    const reward=Math.max(15,Math.floor(score/5));
    window.parent.postMessage({type:'addCoins',amount:reward},'*');
    document.getElementById('ovT').textContent='🏆 Уровень '+level+'!';
    if(level<LEVELS.length){
      document.getElementById('ovP').innerHTML='Собран 👑!<br>Счёт: <b>'+score+'</b><br>Следующий: поле '+LEVELS[level].cols+'×'+LEVELS[level].rows;
      document.getElementById('ov').classList.add('show');
      setTimeout(()=>initLevel(level+1),1800);
    } else {
      document.getElementById('ovP').innerHTML='Счёт: <b>'+score+'</b><br>Все 6 уровней пройдены!';
      document.getElementById('ov').classList.add('show');
    }
  }
}
function dropFruit(col){
  if(!running||over)return;
  if(col<0||col>=cols)return;
  let row=-1;
  for(let y=rows-1;y>=0;y--)if(grid[y][col]===null){row=y;break;}
  if(row===-1)return;
  const maxIdx=LEVELS[Math.min(level-1,LEVELS.length-1)].spawnMax;
  const r=Math.random();
  let idx=0;
  if(r<0.5)idx=0;
  else if(r<0.8)idx=Math.min(1,maxIdx);
  else idx=Math.min(2,maxIdx);
  grid[row][col]={idx,born:performance.now()};
  gravity();
  cascade();
  checkGameOver();
}
function checkGameOver(){
  if(over)return;
  let topFull=true;
  for(let x=0;x<cols;x++)if(grid[0][x]===null){topFull=false;break;}
  if(topFull){
    running=false;over=true;
    window.parent.postMessage({type:'addCoins',amount:Math.max(1,Math.floor(score/15))},'*');
    document.getElementById('ovT').textContent='Поле заполнено';
    document.getElementById('ovP').innerHTML='Счёт: <b>'+score+'</b><br>Уровень: <b>'+level+'</b>';
    document.getElementById('ov').classList.add('show');
  }
}
function draw(){
  ctx.fillStyle='#050a14';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(126,232,176,.06)';ctx.lineWidth=1;
  for(let i=1;i<cols;i++){
    ctx.beginPath();ctx.moveTo(OX+i*CELL,OY);ctx.lineTo(OX+i*CELL,OY+rows*CELL);ctx.stroke();
  }
  for(let i=1;i<rows;i++){
    ctx.beginPath();ctx.moveTo(OX,OY+i*CELL);ctx.lineTo(OX+cols*CELL,OY+i*CELL);ctx.stroke();
  }
  ctx.strokeStyle='#2a3a5c';ctx.lineWidth=2;
  ctx.strokeRect(OX-1,OY-1,cols*CELL+2,rows*CELL+2);
  // danger line
  ctx.strokeStyle='rgba(255,82,82,.35)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(OX,OY+CELL);ctx.lineTo(OX+cols*CELL,OY+CELL);ctx.stroke();
  ctx.setLineDash([]);
  const now=performance.now();
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=grid[y][x];if(!c)continue;
    const f=FRUITS[c.idx];
    const cx=OX+x*CELL+CELL/2,cy=OY+y*CELL+CELL/2;
    const age=Math.min(1,(now-c.born)/250);
    const r=CELL*0.42*age;
    ctx.shadowColor=f.color;ctx.shadowBlur=12;
    ctx.fillStyle=f.color;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.3,r*0.35,0,Math.PI*2);ctx.fill();
    if(age>0.4){
      ctx.font=(CELL*0.62)+'px serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(f.emoji,cx,cy+CELL*0.03);
    }
  }
  if(dropCol>=0&&running){
    const cx=OX+dropCol*CELL+CELL/2;
    ctx.strokeStyle='rgba(126,232,176,.5)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(cx,OY);ctx.lineTo(cx,OY+rows*CELL);ctx.stroke();
    ctx.setLineDash([]);
  }
}
function loop(){draw();requestAnimationFrame(loop);}
function colFromX(px){const c=Math.floor((px-OX)/CELL);return(c<0||c>=cols)?-1:c;}
function tapAt(cx,cy){
  const r=cvs.getBoundingClientRect();
  const px=(cx-r.left)*(W/r.width);
  const col=colFromX(px);
  if(col>=0){dropCol=col;dropFruit(col);dropCol=-1;}
}
cvs.addEventListener('touchstart',e=>{e.preventDefault();tapAt(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cvs.addEventListener('mousedown',e=>tapAt(e.clientX,e.clientY));
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'||k==='ф'){
    e.preventDefault();if(dropCol<0)dropCol=Math.floor(cols/2);else dropCol=Math.max(0,dropCol-1);
  } else if(k==='arrowright'||k==='d'||k==='в'){
    e.preventDefault();if(dropCol<0)dropCol=Math.floor(cols/2);else dropCol=Math.min(cols-1,dropCol+1);
  } else if(k==='arrowdown'||k==='s'||k==='ы'||k===' '||k==='enter'){
    e.preventDefault();if(dropCol<0)dropCol=Math.floor(cols/2);
    dropFruit(dropCol);dropCol=-1;
  }
});
document.querySelectorAll('.dpad button').forEach(b=>b.addEventListener('click',()=>{
  const d=b.dataset.dir;
  if(d==='left'){if(dropCol<0)dropCol=Math.floor(cols/2);else dropCol=Math.max(0,dropCol-1);}
  else if(d==='right'){if(dropCol<0)dropCol=Math.floor(cols/2);else dropCol=Math.min(cols-1,dropCol+1);}
  else if(d==='down'){if(dropCol<0)dropCol=Math.floor(cols/2);dropFruit(dropCol);dropCol=-1;}
}));
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.type!=='input')return;
  if(d.act==='left'){if(dropCol<0)dropCol=Math.floor(cols/2);else dropCol=Math.max(0,dropCol-1);}
  else if(d.act==='right'){if(dropCol<0)dropCol=Math.floor(cols/2);else dropCol=Math.min(cols-1,dropCol+1);}
  else if(d.act==='down'||d.act==='ok'||d.act==='a'){if(dropCol<0)dropCol=Math.floor(cols/2);dropFruit(dropCol);dropCol=-1;}
  else if(d.act==='back'||d.act==='menu')window.parent.postMessage({type:'exit'},'*');
});
document.getElementById('bNew').addEventListener('click',()=>initLevel(1));
document.getElementById('ovB').addEventListener('click',()=>initLevel(1));
document.getElementById('bExit').addEventListener('click',()=>window.parent.postMessage({type:'exit'},'*'));
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
initLevel(1);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
