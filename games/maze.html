<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Лабиринт</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;padding:8px;gap:8px}.hud{display:flex;gap:14px;font-size:11px;letter-spacing:1px;color:rgba(200,220,255,.6);text-transform:uppercase}.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}.wrap{position:relative;display:flex}.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.94);border-radius:10px;gap:12px;padding:20px;text-align:center;z-index:10}.msg.show{display:flex}.msg h2{color:#7ee8b0;font-size:20px}.msg p{font-size:12px;color:rgba(200,220,255,.75);line-height:1.6}.msg button{font:inherit;font-size:13px;font-weight:700;padding:10px 22px;border:2px solid #7ee8b0;border-radius:8px;background:#7ee8b0;color:#06210f;cursor:pointer}.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;max-width:180px;width:58vw}.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:8px;color:#cfe0ff;font-size:16px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer}.pad button:active{color:#7ee8b0;border-color:#7ee8b0}.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a)}</style></head><body>
<div class="hud"><span>Ур.<b id="lv">1</b></span><span>Шаги<b id="mv">0</b></span><span>Размер<b id="sz">9×9</b></span><span>💰<b id="coins">0</b></span></div>
<div class="wrap"><canvas id="c" width="360" height="360"></canvas><div class="msg" id="msg"></div></div>
<div class="pad" id="pad"></div>
<script>(function(){const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');
let grid,size,CELL,px,py,endX,endY,path,moves,level,alive;
let totalCoins=Number(localStorage.getItem('maze_coins')||0);
function gen(sz){
size=sz;grid=Array.from({length:sz},()=>Array(sz).fill(1));
function carve(x,y){grid[y][x]=0;const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);for(const d of dirs){const nx=x+d[0],ny=y+d[1];if(nx>0&&ny>0&&nx<sz-1&&ny<sz-1&&grid[ny][nx]===1){grid[y+d[1]/2][x+d[0]/2]=0;carve(nx,ny);}}}
carve(1,1);grid[1][1]=2;grid[sz-2][sz-2]=3;px=1;py=1;endX=sz-2;endY=sz-2;}
function init(){const sz=7+Math.min((level-1)*2,30);gen(sz%2?sz:sz+1);moves=0;alive=true;CELL=c.width/size;render();}
function show(t,p,b,n){const m=$('msg');m.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';m.classList.add('show');const bt=document.createElement('button');bt.textContent=b;bt.onclick=()=>{m.classList.remove('show');n();};m.appendChild(bt);}
function move(dx,dy){if(!alive)return;const nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=size||ny>=size)return;if(grid[ny][nx]===1)return;px=nx;py=ny;moves++;if(px===endX&&py===endY){const r=25+level*8;totalCoins+=r;localStorage.setItem('maze_coins',totalCoins);try{window.parent.postMessage({type:'addCoins',amount:r},'*');}catch(e){}level++;localStorage.setItem('maze_lv',level);show('🎉 Выход найден!','Шагов: '+moves+'<br>+'+r+'💰','Дальше',init);}render();}
function render(){
ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
for(let y=0;y<size;y++)for(let x=0;x<size;x++){const v=grid[y][x];const rx=x*CELL,ry=y*CELL;
if(v===1){ctx.fillStyle='#1a2540';ctx.fillRect(rx,ry,CELL,CELL);}
else if(v===2){ctx.fillStyle='#7ee8b0';ctx.beginPath();ctx.arc(rx+CELL/2,ry+CELL/2,CELL*0.35,0,7);ctx.fill();}
else if(v===3){ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(rx+CELL/2,ry+CELL/2,CELL*0.4,0,7);ctx.fill();ctx.fillStyle='#06210f';ctx.font='bold '+(CELL*0.5)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',rx+CELL/2,ry+CELL/2+1);}}
ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(px*CELL+CELL/2,py*CELL+CELL/2,CELL*0.32,0,7);ctx.fill();ctx.fillStyle='#7ee8b0';ctx.beginPath();ctx.arc(px*CELL+CELL/2,py*CELL+CELL/2,CELL*0.22,0,7);ctx.fill();
$('lv').textContent=level;$('mv').textContent=moves;$('sz').textContent=size+'×'+size;$('coins').textContent=totalCoins;}
const pad=$('pad');[{},{l:'▲',d:[0,-1]},{},{l:'◀',d:[-1,0]},{l:'OK',ok:1},{l:'▶',d:[1,0]},{},{l:'▼',d:[0,1]},{}].forEach(it=>{const b=document.createElement('button');b.textContent=it.l||'';if(it.ok)b.className='ok';b.addEventListener('click',()=>{if(it.ok){if(px===endX&&py===endY)init();}else if(it.d)move(it.d[0],it.d[1]);});pad.appendChild(b);});
document.addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key];if(m){e.preventDefault();move(m[0],m[1]);}});
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.hypot(dx,dy)<20)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);},{passive:true});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='input'){const m={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};if(m[d.act])move(m[d.act][0],m[d.act][1]);else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}}});
level=Number(localStorage.getItem('maze_lv')||1);init();})();</script></body></html>
