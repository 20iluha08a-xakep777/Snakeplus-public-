<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pac-Man</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;padding:8px;gap:8px}.hud{display:flex;gap:14px;font-size:11px;letter-spacing:1px;color:rgba(200,220,255,.6);text-transform:uppercase}.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}.wrap{position:relative;display:flex}.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.94);border-radius:10px;gap:12px;padding:20px;text-align:center;z-index:10}.msg.show{display:flex}.msg h2{color:#7ee8b0;font-size:20px;letter-spacing:2px}.msg p{font-size:12px;color:rgba(200,220,255,.75);line-height:1.6}.msg button{font:inherit;font-size:13px;font-weight:700;padding:10px 22px;border:2px solid #7ee8b0;border-radius:8px;background:#7ee8b0;color:#06210f;cursor:pointer;letter-spacing:1px}.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;max-width:180px;width:58vw}.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:8px;color:#cfe0ff;font-size:16px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer}.pad button:active{color:#7ee8b0;border-color:#7ee8b0}.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a)}</style></head><body>
<div class="hud"><span>Ур.<b id="lv">1</b></span><span>Очки<b id="sc">0</b></span><span>Жизни<b id="hp">3</b></span><span>💰<b id="coins">0</b></span></div>
<div class="wrap"><canvas id="c" width="380" height="380"></canvas><div class="msg" id="msg"></div></div>
<div class="pad" id="pad"></div>
<script>(function(){const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');
const MAPS=[
"#################,#o....o...o....o##,#.###.###.###.#,#o#.....o.....#,#.#.###.#.###.#,#...#...#...#.#,###.#.#.#.#.###,#.....#.#.....#,#.###.#.#.###.#,#o..#.....#..o#,##.#.###.#.##,#...#.#.#.#...#,#.###.#.#.###.#,#o.........o.o#,#..............#",
"#################,#o..o..o..o..o.##,#.###.#.#.###.#,#o#.#.....#.#o#,#.#.#.###.#.#.#,#...#...#...#.#,####.#.#.####,#o...#.#.#...o#,#.###.#.#.###.#,#.#o..#.#..#.o#,##.#.####.#.##,#...#.....#...#,#.###.###.###.#,#o.o.......o.o#,#.............#",
"#################,#o.o.o.o.o.o.o.##,#.#####.#####.#,#.#...#.#...#.#,#.#.#.....#.#.#,#o..#.#.#.#.#..o#,###.#.#.#.#.###,#.....#.#.....#,##.#.#.#.#.#.##,#o#....#....#o#,#.#.#####.###.#,#.#.#.#.#.#.#.#,#.#.#.#.#.#.#.#,#o.....o.....o.#,#.............#",
"#################,#ooooooooooooo.##,#.###########.#,#.#...........#,#.#.#########.#,#...#.......o...#,##.#.#.#.#.#.#.##,#o.#.#.#.#.#..o#,##.#.#.#.#.#.#.##,#.#...#.#.#...#.#,#.#.#.#.#.#.#.#,#.#.#.....#.#.#,#o...#.....#...o#,#.............#"
];
let grid,mW,mH,CELL,px,py,pdir,ndir,ghosts,score,level,lives,pellets,powers,eaten,alive,powerTimer,ghostSpeed,ghostMoveAcc;
let totalCoins=Number(localStorage.getItem('pacman_coins')||0),maxLv=Number(localStorage.getItem('pacman_maxlv')||1);
const ghostColors=['#ff5757','#ff8a65','#b07ee8','#66d9ff'];
function parseMap(m){const rows=m.split(',');mH=rows.length;mW=rows[0].length;CELL=Math.min(c.width/mW,c.height/mH);grid=[];pellets=0;powers=0;for(let r=0;r<mH;r++){grid[r]=[];for(let k=0;k<mW;k++){const ch=rows[r][k];grid[r][k]=ch;if(ch==='#')continue;if(ch==='o')pellets++;if(ch==='.')powers++;}}
pellets+=powers;}
function tileAt(x,y){const tx=Math.floor(x/CELL),ty=Math.floor(y/CELL);if(tx<0||ty<0||tx>=mW||ty>=mH)return '#';return grid[ty][tx];}
function eatAt(x,y){const tx=Math.floor(x/CELL),ty=Math.floor(y/CELL);if(grid[ty][tx]==='o'){grid[ty][tx]=' ';pellets--;score+=10;}else if(grid[ty][tx]==='.'){grid[ty][tx]=' ';pellets--;score+=50;powerTimer=6000;}}
function init(){parseMap(MAPS[(level-1)%MAPS.length]);
px=1.5*CELL;py=1.5*CELL;pdir={x:0,y:0};ndir={x:0,y:0};
ghosts=[];const count=2+Math.min(Math.floor((level-1)/4),2);
const corners=[[mW-2.5,1.5],[1.5,mH-2.5],[mW-2.5,mH-2.5]];
for(let i=0;i<count;i++)ghosts.push({x:corners[i][0]*CELL,y:corners[i][1]*CELL,dir:{x:1,y:0},color:ghostColors[i],dead:false});
score=score||0;alive=true;powerTimer=0;ghostSpeed=0.55+level*0.05;ghostMoveAcc=0;render();}
function show(t,p,b,next){const m=$('msg');m.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';m.classList.add('show');const btn=document.createElement('button');btn.textContent=b;btn.onclick=()=>{m.classList.remove('show');next();};m.appendChild(btn);}
function step(dt){
const speed=0.14*dt;
px+=pdir.x*speed;py+=pdir.y*speed;
if(px<CELL)px=CELL;if(py<CELL)py=CELL;if(px>(mW-1)*CELL)px=(mW-1)*CELL;if(py>(mH-1)*CELL)py=(mH-1)*CELL;
const tx=Math.floor(px/CELL),ty=Math.floor(py/CELL);
if(tileAt(px,py)==='#'){px-=pdir.x*speed;py-=pdir.y*speed;pdir={x:0,y:0};}
if(ndir.x||ndir.y){const nx=px+ndir.x*CELL*0.6,ny=py+ndir.y*CELL*0.6;if(tileAt(nx,ny)!=='#'){pdir={...ndir};ndir={x:0,y:0};}}
eatAt(px,py);
if(powerTimer>0)powerTimer=Math.max(0,powerTimer-dt);
ghostMoveAcc+=dt;
if(ghostMoveAcc>80){ghostMoveAcc=0;
for(const g of ghosts){
const gt=Math.floor(g.x/CELL),gt2=Math.floor(g.y/CELL);
if(Math.abs(gt-tx)+Math.abs(gt2-ty)<1){if(powerTimer>0){score+=200;g.x=1.5*CELL;g.y=1.5*CELL;continue;}else{continue;}}
const opts=[];
if(tileAt(g.x+CELL,g.y)!=='#')opts.push({x:1,y:0});
if(tileAt(g.x-CELL,g.y)!=='#')opts.push({x:-1,y:0});
if(tileAt(g.x,g.y+CELL)!=='#')opts.push({x:0,y:1});
if(tileAt(g.x,g.y-CELL)!=='#')opts.push({x:0,y:-1});
let pick=null;
if(powerTimer>0){opts.forEach(o=>{const d=Math.abs(g.x+o.x*CELL-px)+Math.abs(g.y+o.y*CELL-py);if(!pick||d>pick.d)pick={o,d};});}
else{opts.forEach(o=>{const d=Math.abs(g.x+o.x*CELL-px)+Math.abs(g.y+o.y*CELL-py);if(!pick||d<pick.d)pick={o,d};});}
if(pick){g.x+=pick.o.x*CELL;g.y+=pick.o.y*CELL;}
const dx=g.x-px,dy=g.y-py;if(Math.abs(dx)<CELL*0.7&&Math.abs(dy)<CELL*0.7){if(powerTimer<=0){lives--;if(lives<=0){alive=false;show('💀 Игра окончена','Очки: '+score+'<br>Начинаем с 1-го','Заново',()=>{level=1;lives=3;score=0;init();});return;}px=1.5*CELL;py=1.5*CELL;return;}else{score+=200;g.x=1.5*CELL;g.y=1.5*CELL;}}
}
}
if(pellets<=0){const reward=20+level*10;totalCoins+=reward;localStorage.setItem('pacman_coins',totalCoins);if(level+1>maxLv){maxLv=level+1;localStorage.setItem('pacman_maxlv',maxLv);}try{window.parent.postMessage({type:'addCoins',amount:reward},'*');}catch(e){}level++;show('🎉 Уровень пройден!','+'+reward+'💰<br>Уровень '+level,'Дальше',()=>init());}
}
function render(){
ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
for(let r=0;r<mH;r++)for(let k=0;k<mW;k++){const ch=grid[r][k];if(ch==='#'){ctx.fillStyle='#1a2540';ctx.fillRect(k*CELL,r*CELL,CELL,CELL);}else if(ch==='o'){ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(k*CELL+CELL/2,r*CELL+CELL/2,CELL*0.08,0,7);ctx.fill();}else if(ch==='.'){ctx.fillStyle='#7ee8b0';ctx.beginPath();ctx.arc(k*CELL+CELL/2,r*CELL+CELL/2,CELL*0.2,0,7);ctx.fill();}}
// Pac
const mouth=Math.abs(Math.sin(performance.now()/150))*0.4;
ctx.fillStyle=powerTimer>0?'#ffffff':'#7ee8b0';
ctx.beginPath();const ang=Math.atan2(pdir.y,pdir.x)||0;
ctx.arc(px+CELL/2,py+CELL/2,CELL*0.4,ang+mouth,ang+Math.PI*2-mouth);ctx.lineTo(px+CELL/2,py+CELL/2);ctx.fill();
// Ghosts
for(const g of ghosts){ctx.fillStyle=powerTimer>0?'#3a7ee8':g.color;ctx.beginPath();ctx.arc(g.x+CELL/2,g.y+CELL*0.4,CELL*0.4,Math.PI,0);ctx.lineTo(g.x+CELL*0.9,g.y+CELL*0.85);ctx.lineTo(g.x+CELL*0.7,g.y+CELL*0.7);ctx.lineTo(g.x+CELL*0.5,g.y+CELL*0.85);ctx.lineTo(g.x+CELL*0.3,g.y+CELL*0.7);ctx.lineTo(g.x+CELL*0.1,g.y+CELL*0.85);ctx.closePath();ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.x+CELL*0.35,g.y+CELL*0.4,CELL*0.1,0,7);ctx.arc(g.x+CELL*0.65,g.y+CELL*0.4,CELL*0.1,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(g.x+CELL*0.35,g.y+CELL*0.4,CELL*0.05,0,7);ctx.arc(g.x+CELL*0.65,g.y+CELL*0.4,CELL*0.05,0,7);ctx.fill();}
$('lv').textContent=level;$('sc').textContent=score;$('hp').textContent=lives;$('coins').textContent=totalCoins;
}
let last=0;function loop(t){if(!alive)return;const dt=Math.min(t-last,50);last=t;step(dt);render();requestAnimationFrame(loop);}
const pad=$('pad');[{},{l:'▲',d:'u'},{},{l:'◀',d:'l'},{l:'OK',ok:1},{l:'▶',d:'r'},{},{l:'▼',d:'d'},{}].forEach(it=>{const b=document.createElement('button');b.textContent=it.l||'';if(it.ok)b.className='ok';b.addEventListener('click',()=>{if(it.ok){if(!alive){level=1;lives=3;score=0;init();requestAnimationFrame(loop);}}else if(it.d){ndir={x:it.d==='l'?-1:it.d==='r'?1:0,y:it.d==='u'?-1:it.d==='d'?1:0};}});pad.appendChild(b);});
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.hypot(dx,dy)<20)return;if(Math.abs(dx)>Math.abs(dy))ndir={x:dx>0?1:-1,y:0};else ndir={x:0,y:dy>0?1:-1};},{passive:true});
document.addEventListener('keydown',e=>{const m={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1}};const k=m[e.key];if(k){e.preventDefault();ndir=k;}});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='input'){const m={left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1}};if(d.act==='left'||d.act==='right'||d.act==='up'||d.act==='down')ndir=m[d.act];else if(d.act==='ok'&&!alive){level=1;lives=3;score=0;init();requestAnimationFrame(loop);}else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}}});
level=Number(localStorage.getItem('pacman_lv')||1);lives=3;score=0;init();requestAnimationFrame(loop);})();</script></body></html>
