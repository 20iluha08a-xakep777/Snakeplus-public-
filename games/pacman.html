<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pac-Man</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding:52px 4px 4px;gap:4px}
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(200,220,255,.5);padding:0 8px;flex-shrink:0}
.hdr b{color:#7ee8b0;font-size:12px;margin-left:3px}
.hdr .coins{font-size:11px;color:#ffd54a;font-weight:800}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;position:relative}
canvas{background:#050a14;border-radius:12px;box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 0 1.5px rgba(126,232,176,.25);display:block;touch-action:none;max-width:100%;max-height:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px;max-width:160px;width:46vw;margin:0 auto;flex-shrink:0}
.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:10px;color:#cfe0ff;font-size:20px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer;touch-action:none;transition:transform .08s;user-select:none;display:flex;align-items:center;justify-content:center}
.pad button:active,.pad button.pressed{color:#7ee8b0;border-color:#7ee8b0;transform:scale(.94)}
.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a);font-size:13px}
.msg{position:fixed;inset:0;background:rgba(5,10,20,.94);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:100}
.msg.show{display:flex}
.msg h2{color:#7ee8b0;font-size:22px;letter-spacing:2px;text-transform:uppercase}
.msg p{font-size:13px;color:rgba(200,220,255,.8);line-height:1.7;max-width:300px}
.msg .row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg button{font:inherit;font-size:13px;font-weight:800;padding:12px 22px;border:2px solid #7ee8b0;border-radius:10px;background:linear-gradient(180deg,#8ff5bd,#48c98a);color:#06210f;cursor:pointer;letter-spacing:1px;text-transform:uppercase;min-width:110px;transition:opacity .15s}
.msg button:disabled{opacity:.5;cursor:default}
.msg button.ghost{background:transparent;color:#7ee8b0}
.levels-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:320px;max-height:70vh;overflow-y:auto;padding:4px;margin-top:6px}
.lv-btn{aspect-ratio:1;border-radius:10px;border:1.5px solid rgba(126,232,176,.3);background:rgba(126,232,176,.05);color:#7ee8b0;font:inherit;font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation}
.lv-btn.done{background:linear-gradient(180deg,rgba(126,232,176,.3),rgba(72,201,138,.15));border-color:#7ee8b0}
.lv-btn.locked{opacity:.35;cursor:default}
.lv-btn.current{border-color:#ffd54a;box-shadow:0 0 0 2px rgba(255,213,74,.3)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-150%);background:#7ee8b0;color:#06210f;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:800;z-index:200;transition:all .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span>Ур.<b id="lv">1</b> · Очки<b id="sc">0</b> · Жизни<b id="hp">3</b></span>
    <span class="coins">💰 <span id="coins">0</span></span>
  </div>
  <div class="stage"><canvas id="c" width="400" height="480"></canvas></div>
  <div class="pad" id="pad"></div>
</div>
<div class="msg" id="msg"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const c=$('c'),ctx=c.getContext('2d');

/* ============ ANTI-LAG ============ */
let _gen=0;
let _timers=[];
let _inputLocked=false;
let _initializing=false;
function _safeTimeout(fn,ms){
  const id=setTimeout(()=>{_timers=_timers.filter(t=>t!==id);fn();},ms);
  _timers.push(id);
  return id;
}
function _clearAllTimers(){
  _timers.forEach(id=>{clearTimeout(id);clearInterval(id);});
  _timers=[];
}
function _lockInput(ms){_inputLocked=true;_safeTimeout(()=>{_inputLocked=false;},ms||400);}

/* ============ ОРИГИНАЛЬНЫЙ ЛАБИРИНТ 21×25 ============ */
const MAZE=[
"#####################",
"#.........#.........#",
"#.###.###.#.###.###.#",
"#o#.....#.#.....#..o#",
"#.#.###.#.#.###.#.#.#",
"#...#...#...#...#...#",
"###.#.#####.#####.#.#",
"#.....#.......#.....#",
"#.###.###.#.###.###.#",
"#.....#...#...#.....#",
"#.###.#.#.#.#.#.###.#",
"#.....#.......#.....#",
"###.#.#.#####.#.#.###",
"#.....#.......#.....#",
"#.###.#.#.#.#.#.###.#",
"#.....#...#...#.....#",
"#.###.###.#.###.###.#",
"#.....#.......#.....#",
"###.#.#####.#####.#.#",
"#...#...#...#...#...#",
"#.#.###.#.#.###.#.#.#",
"#o#.....#.#.....#..o#",
"#.###.###.#.###.###.#",
"#.........#.........#",
"#####################"
];
const MW=21,MH=25;
let CELL;

let grid,pelletsLeft;
let pacman,ghosts,score,lives,level,alive,gameActive;
let powerTimer,powerGhostCombo,lastT;
let totalCoins=Number(localStorage.getItem('pm_coins')||0);
let maxLevel=Number(localStorage.getItem('pm_maxlv')||1);
let doneLevels=(()=>{try{return JSON.parse(localStorage.getItem('pm_done')||'[]');}catch(e){return[];}})();
let fruit,fruitTimer=0;
let pacmanStart,ghostHome;

function save(){
  localStorage.setItem('pm_coins',totalCoins);
  localStorage.setItem('pm_maxlv',maxLevel);
  localStorage.setItem('pm_done',JSON.stringify(doneLevels));
  localStorage.setItem('pm_lv',level);
  postProgress();
}
function postCoins(n){try{window.parent.postMessage({type:'addCoins',amount:n},'*');}catch(e){}}
function postProgress(){try{window.parent.postMessage({type:'gameProgress',game:'pacman',level:level,coins:totalCoins,done:doneLevels},'*');}catch(e){}}

/* ============ ОЗВУЧКА ============ */
let audioCtx=null;
function ac(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
let chompHigh=false;
function playChomp(){
  try{
    const a=ac();
    const now=a.currentTime;
    const osc=a.createOscillator(),g=a.createGain();
    osc.type='square';
    osc.frequency.value=chompHigh?280:190;
    chompHigh=!chompHigh;
    g.gain.setValueAtTime(0.045,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.07);
    osc.connect(g).connect(a.destination);
    osc.start(now);osc.stop(now+0.075);
  }catch(e){}
}
function playPower(){
  try{
    const a=ac();
    const now=a.currentTime;
    for(let i=0;i<4;i++){
      const osc=a.createOscillator(),g=a.createGain();
      osc.type='square';
      osc.frequency.value=280+i*140;
      const t=now+i*0.06;
      g.gain.setValueAtTime(0.05,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
      osc.connect(g).connect(a.destination);
      osc.start(t);osc.stop(t+0.08);
    }
  }catch(e){}
}
function playEatGhost(){
  try{
    const a=ac();
    const now=a.currentTime;
    for(let i=0;i<6;i++){
      const osc=a.createOscillator(),g=a.createGain();
      osc.type='square';
      osc.frequency.value=200+i*120;
      const t=now+i*0.045;
      g.gain.setValueAtTime(0.055,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
      osc.connect(g).connect(a.destination);
      osc.start(t);osc.stop(t+0.08);
    }
  }catch(e){}
}
function playDeath(){
  try{
    const a=ac();
    const now=a.currentTime;
    const osc=a.createOscillator(),g=a.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(900,now);
    osc.frequency.exponentialRampToValueAtTime(90,now+0.9);
    g.gain.setValueAtTime(0.09,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.95);
    osc.connect(g).connect(a.destination);
    osc.start(now);osc.stop(now+0.95);
  }catch(e){}
}
function playFruit(){
  try{
    const a=ac();
    const now=a.currentTime;
    [880,1175,1568].forEach((f,i)=>{
      const osc=a.createOscillator(),g=a.createGain();
      osc.type='triangle';
      osc.frequency.value=f;
      const t=now+i*0.07;
      g.gain.setValueAtTime(0.08,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      osc.connect(g).connect(a.destination);
      osc.start(t);osc.stop(t+0.11);
    });
  }catch(e){}
}
function playLevelUp(){
  try{
    const a=ac();
    const now=a.currentTime;
    [523,659,784,1047,1319].forEach((f,i)=>{
      const osc=a.createOscillator(),g=a.createGain();
      osc.type='triangle';
      osc.frequency.value=f;
      const t=now+i*0.1;
      g.gain.setValueAtTime(0.1,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      osc.connect(g).connect(a.destination);
      osc.start(t);osc.stop(t+0.16);
    });
  }catch(e){}
}

/* ============ RESIZE ============ */
function resizeCanvas(){
  const stage=c.parentElement;
  const r=stage.getBoundingClientRect();
  const availW=Math.floor(r.width);
  const availH=Math.floor(r.height);
  // Соотношение лабиринта 21:25
  const ratio=MW/MH;
  let w=availW, h=Math.floor(w/ratio);
  if(h>availH){h=availH;w=Math.floor(h*ratio);}
  c.width=w;c.height=h;
  c.style.width=w+'px';
  c.style.height=h+'px';
  CELL=Math.min(w/MW,h/MH);
}

/* ============ INIT ============ */
function init(){
  if(_initializing)return;
  _initializing=true;
  _gen++;
  _clearAllTimers();
  _inputLocked=false;
  lastT=0;

  resizeCanvas();
  grid=[];
  pelletsLeft=0;
  for(let y=0;y<MH;y++){
    grid[y]=[];
    for(let x=0;x<MW;x++){
      const ch=MAZE[y][x];
      grid[y][x]=ch;
      if(ch==='.'||ch==='o')pelletsLeft++;
    }
  }

  const px=Math.floor(MW/2);
  const py=MH-4;
  pacmanStart={x:px,y:py};
  pacman={
    x:px,y:py,
    dir:{x:0,y:0},ndir:{x:0,y:0},
    px:px*CELL+CELL/2,py:py*CELL+CELL/2,
    mouth:0,dead:false,deadTimer:0
  };
  grid[py][px]=' ';

  const gx=Math.floor(MW/2),gy=Math.floor(MH/2);
  ghostHome={x:gx,y:gy};
  const defs=[
    {name:'blinky',color:'#ff5757',sx:gx-1,sy:gy,  dir:{x:-1,y:0}},
    {name:'pinky', color:'#ffb8c8',sx:gx,  sy:gy-1,dir:{x:0,y:1}},
    {name:'inky',  color:'#66d9ff',sx:gx-1,sy:gy+1,dir:{x:1,y:0}},
    {name:'clyde', color:'#ffb852',sx:gx+1,sy:gy+1,dir:{x:-1,y:0}}
  ];
  const cnt=Math.min(2+Math.floor((level-1)/2),4);
  ghosts=[];
  for(let i=0;i<cnt;i++){
    const d=defs[i];
    ghosts.push({
      name:d.name,color:d.color,
      x:d.sx,y:d.sy,
      px:d.sx*CELL+CELL/2,
      py:d.sy*CELL+CELL/2,
      dir:{...d.dir},
      dead:false,deadTimer:0,
      startX:d.sx,startY:d.sy
    });
    grid[d.sy][d.sx]=' ';
  }

  score=0;lives=3;
  alive=true;gameActive=true;
  powerTimer=0;powerGhostCombo=0;
  fruit=null;fruitTimer=0;

  render();
  updateHud();
  _initializing=false;
}

function updateHud(){
  $('lv').textContent=level;
  $('sc').textContent=score;
  $('hp').textContent=lives;
  $('coins').textContent=totalCoins;
}

/* ============ MOVEMENT ============ */
function canMove(gx,gy){
  if(gx<0||gy<0||gx>=MW||gy>=MH)return false;
  return grid[gy][gx]!=='#';
}

function stepPacman(dt){
  if(pacman.dead){
    pacman.deadTimer-=dt;
    if(pacman.deadTimer<=0){
      pacman.x=pacmanStart.x;pacman.y=pacmanStart.y;
      pacman.px=pacman.x*CELL+CELL/2;
      pacman.py=pacman.y*CELL+CELL/2;
      pacman.dir={x:0,y:0};pacman.ndir={x:0,y:0};
      pacman.dead=false;
      for(const g of ghosts){
        g.x=g.startX;g.y=g.startY;
        g.px=g.x*CELL+CELL/2;
        g.py=g.y*CELL+CELL/2;
        g.dir={x:0,y:0};
        g.dead=false;
      }
    }
    return;
  }
  const speed=0.13;
  const targetX=pacman.y*CELL+CELL/2;
  const targetY=pacman.x*CELL+CELL/2;
  if(pacman.px!==targetX||pacman.py!==targetY){
    pacman.px+=Math.sign(targetX-pacman.px)*Math.min(speed*dt,Math.abs(targetX-pacman.px));
    pacman.py+=Math.sign(targetY-pacman.py)*Math.min(speed*dt,Math.abs(targetY-pacman.py));
    return;
  }
  if(pacman.ndir.x||pacman.ndir.y){
    if(canMove(pacman.y+pacman.ndir.x,pacman.x+pacman.ndir.y)){
      pacman.dir={...pacman.ndir};
      pacman.ndir={x:0,y:0};
    }
  }
  if(pacman.dir.x||pacman.dir.y){
    if(canMove(pacman.y+pacman.dir.x,pacman.x+pacman.dir.y)){
      pacman.y+=pacman.dir.x;
      pacman.x+=pacman.dir.y;
      pacman.mouth+=0.2;
      eatPellet();
    } else {
      pacman.dir={x:0,y:0};
    }
  }
}

function eatPellet(){
  const cell=grid[pacman.x][pacman.y];
  if(cell==='.'){
    grid[pacman.x][pacman.y]=' ';
    pelletsLeft--;score+=10;
    playChomp();
    updateHud();
    if(pelletsLeft<=0)winLevel();
  } else if(cell==='o'){
    grid[pacman.x][pacman.y]=' ';
    pelletsLeft--;score+=50;
    powerTimer=7000;powerGhostCombo=0;
    playPower();
    updateHud();
    if(pelletsLeft<=0)winLevel();
  }
  if(fruit&&fruit.x===pacman.y&&fruit.y===pacman.x){
    score+=100;fruit=null;updateHud();
    showToast('🍒 +100');
    playFruit();
  }
}

/* ============ GHOST AI ============ */
function stepGhosts(dt){
  for(const g of ghosts){
    if(g.dead){
      g.deadTimer-=dt;
      if(g.deadTimer<=0){
        g.dead=false;
        g.x=g.startX;g.y=g.startY;
        g.px=g.x*CELL+CELL/2;
        g.py=g.y*CELL+CELL/2;
      }
      continue;
    }
    const targetX=g.y*CELL+CELL/2;
    const targetY=g.x*CELL+CELL/2;
    const gs=powerTimer>0?0.055:0.095+level*0.005;
    if(g.px!==targetX||g.py!==targetY){
      g.px+=Math.sign(targetX-g.px)*Math.min(gs*dt,Math.abs(targetX-g.px));
      g.py+=Math.sign(targetY-g.py)*Math.min(gs*dt,Math.abs(targetY-g.py));
      continue;
    }
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>canMove(g.y+d[0],g.x+d[1]));
    if(!dirs.length)continue;
    const filtered=dirs.filter(d=>!(d[0]===-g.dir.x&&d[1]===-g.dir.y));
    const cands=filtered.length?filtered:dirs;

    let tx,ty;
    if(powerTimer>0){
      tx=g.x<ghostHome.x?MW-2:1;
      ty=g.y<ghostHome.y?MH-2:1;
    } else {
      switch(g.name){
        case 'blinky':tx=pacman.x;ty=pacman.y;break;
        case 'pinky':tx=pacman.x+pacman.dir.x*4;ty=pacman.y+pacman.dir.y*4;break;
        case 'inky':tx=pacman.x+Math.sign(pacman.x-g.x)*2;ty=pacman.y+Math.sign(pacman.y-g.y)*2;break;
        case 'clyde':{
          const dist=Math.abs(g.x-pacman.x)+Math.abs(g.y-pacman.y);
          if(dist>8){tx=pacman.x;ty=pacman.y;} else {tx=1;ty=MH-2;}
          break;
        }
        default:tx=pacman.x;ty=pacman.y;
      }
    }
    if(Math.random()<0.08){tx=Math.floor(Math.random()*MW);ty=Math.floor(Math.random()*MH);}

    let pick=cands[0];
    if(powerTimer>0){
      let best=-1;
      for(const d of cands){
        const nx=g.y+d[0],ny=g.x+d[1];
        const dist=Math.abs(nx-tx)+Math.abs(ny-ty);
        if(dist>best){best=dist;pick=d;}
      }
    } else {
      let best=99999;
      for(const d of cands){
        const nx=g.y+d[0],ny=g.x+d[1];
        const dist=Math.abs(nx-tx)+Math.abs(ny-ty);
        if(dist<best){best=dist;pick=d;}
      }
    }
    g.dir={x:pick[0],y:pick[1]};
    g.y+=pick[0];g.x+=pick[1];
  }

  for(const g of ghosts){
    if(g.dead)continue;
    if(Math.abs(g.px-pacman.px)<CELL*0.75&&Math.abs(g.py-pacman.py)<CELL*0.75){
      if(powerTimer>0){
        powerGhostCombo++;
        const bonus=200*Math.pow(2,Math.min(powerGhostCombo-1,3));
        score+=bonus;
        updateHud();
        showToast('+'+bonus);
        g.dead=true;g.deadTimer=2500;
        playEatGhost();
      } else if(!pacman.dead&&alive){
        pacman.dead=true;
        pacman.deadTimer=1400;
        lives--;
        updateHud();
        playDeath();
        _lockInput(1500);
        if(lives<=0){
          gameActive=false;
          _safeTimeout(()=>onLose(),1400);
        }
      }
    }
  }
}

/* ============ WIN / LOSE ============ */
function winLevel(){
  gameActive=false;
  if(doneLevels.indexOf(level)===-1)doneLevels.push(level);
  const reward=50+level*20;
  totalCoins+=reward;postCoins(reward);
  if(level+1>maxLevel)maxLevel=level+1;
  save();
  playLevelUp();
  _safeTimeout(()=>{
    showModal('🎉 Уровень пройден!',
      'Очки: '+score+'<br>+'+reward+' 💰<br>Открыт '+maxLevel+'-й',
      'Следующий',()=>{level++;save();init();});
  },500);
}
function onLose(){
  showModal('💀 Игра окончена',
    'Очки: '+score+'<br>Уровень '+level,
    'Заново',()=>{init();});
}

/* ============ RENDER ============ */
function render(){
  ctx.fillStyle='#050a14';
  ctx.fillRect(0,0,c.width,c.height);

  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      const px=x*CELL,py=y*CELL;
      const v=grid[y][x];
      if(v==='#'){
        ctx.fillStyle='#1a2540';
        ctx.fillRect(px,py,CELL,CELL);
        ctx.fillStyle='#2a3a5c';
        ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
        ctx.fillStyle='#1a2540';
        ctx.fillRect(px+2,py+2,CELL-4,CELL-4);
      } else if(v==='.'){
        ctx.fillStyle='#ffd54a';
        ctx.beginPath();
        ctx.arc(px+CELL/2,py+CELL/2,Math.max(2,CELL*0.11),0,Math.PI*2);
        ctx.fill();
      } else if(v==='o'){
        const pulse=0.7+0.3*Math.sin(performance.now()/200);
        ctx.fillStyle='#7ee8b0';
        ctx.shadowColor='#7ee8b0';ctx.shadowBlur=12;
        ctx.beginPath();
        ctx.arc(px+CELL/2,py+CELL/2,CELL*0.26*pulse,0,Math.PI*2);
        ctx.fill();
        ctx.shadowBlur=0;
      }
    }
  }

  if(fruit&&fruit.expires>performance.now()){
    const px=fruit.y*CELL+CELL/2,py=fruit.x*CELL+CELL/2;
    ctx.font=(CELL*1.2)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🍒',px,py+1);
  }

  if(alive&&!pacman.dead){
    const cx=pacman.px,cy=pacman.py;
    ctx.fillStyle=powerTimer>0?'#ffffff':'#ffd54a';
    ctx.shadowColor=powerTimer>0?'#ffffff':'#ffd54a';
    ctx.shadowBlur=powerTimer>0?18:8;
    let ang=0;
    if(pacman.dir.x===1)ang=0;
    else if(pacman.dir.x===-1)ang=Math.PI;
    else if(pacman.dir.y===1)ang=Math.PI/2;
    else if(pacman.dir.y===-1)ang=-Math.PI/2;
    const mouth=Math.abs(Math.sin(pacman.mouth))*0.55;
    ctx.beginPath();
    ctx.arc(cx,cy,CELL*0.44,ang+mouth,ang+Math.PI*2-mouth);
    ctx.lineTo(cx,cy);
    ctx.fill();
    ctx.shadowBlur=0;
  }

  for(const g of ghosts){
    if(g.dead)continue;
    const cx=g.px,cy=g.py;
    const fright=powerTimer>0;
    const blink=fright&&powerTimer<2000&&Math.floor(performance.now()/200)%2===0;
    const col=blink?'#ffffff':(fright?'#3a7ee8':g.color);
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(cx,cy-CELL*0.12,CELL*0.42,Math.PI,0);
    const w=CELL*0.42,bottom=cy+CELL*0.36;
    ctx.lineTo(cx+w,bottom);
    for(let i=0;i<3;i++){
      const x1=cx+w-(i*2+1)*w/3;
      const x2=cx+w-(i*2+2)*w/3;
      ctx.lineTo(x1,bottom);
      ctx.lineTo((x1+x2)/2,bottom-CELL*0.1);
      ctx.lineTo(x2,bottom);
    }
    ctx.closePath();
    ctx.fill();

    if(fright){
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(cx-CELL*0.14,cy-CELL*0.1,CELL*0.09,0,Math.PI*2);
      ctx.arc(cx+CELL*0.14,cy-CELL*0.1,CELL*0.09,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#ff5757';
      ctx.beginPath();
      ctx.arc(cx-CELL*0.14,cy-CELL*0.1,CELL*0.04,0,Math.PI*2);
      ctx.arc(cx+CELL*0.14,cy-CELL*0.1,CELL*0.04,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(cx-CELL*0.15,cy-CELL*0.08,CELL*0.14,0,Math.PI*2);
      ctx.arc(cx+CELL*0.15,cy-CELL*0.08,CELL*0.14,0,Math.PI*2);
      ctx.fill();
      const dx=g.dir.x*CELL*0.06,dy=g.dir.y*CELL*0.06;
      ctx.fillStyle='#000';
      ctx.beginPath();
      ctx.arc(cx-CELL*0.15+dx,cy-CELL*0.08+dy,CELL*0.07,0,Math.PI*2);
      ctx.arc(cx+CELL*0.15+dx,cy-CELL*0.08+dy,CELL*0.07,0,Math.PI*2);
      ctx.fill();
    }
  }
}

/* ============ LOOP ============ */
function loop(t){
  const myGen=_gen;
  lastT=lastT||t;
  function tick(now){
    if(myGen!==_gen)return;
    const dt=Math.min(now-lastT,60);
    lastT=now;
    if(gameActive){
      stepPacman(dt);
      stepGhosts(dt);
      if(powerTimer>0)powerTimer=Math.max(0,powerTimer-dt);
      if(fruit&&fruit.expires<performance.now())fruit=null;
      fruitTimer+=dt;
      if(fruitTimer>25000&&!fruit){
        fruitTimer=0;
        const spots=[];
        for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(grid[y][x]==='.')spots.push({x,y});
        if(spots.length){
          const s=spots[Math.floor(Math.random()*spots.length)];
          fruit={x:s.y,y:s.x,expires:performance.now()+10000};
        }
      }
    }
    render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ============ INPUT ============ */
const pad=$('pad');
const layout=[
  {},{act:'up',label:'▲'},{},
  {act:'left',label:'◀'},{act:'ok',label:'OK',cls:'ok'},{act:'right',label:'▶'},
  {},{act:'down',label:'▼'},{}
];
layout.forEach(item=>{
  const b=document.createElement('button');
  if(!item.act){b.style.visibility='hidden';pad.appendChild(b);return;}
  b.textContent=item.label;
  if(item.cls)b.className=item.cls;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    b.classList.add('pressed');
    if(_inputLocked)return;
    if(item.act==='up')pacman.ndir={x:0,y:-1};
    else if(item.act==='down')pacman.ndir={x:0,y:1};
    else if(item.act==='left')pacman.ndir={x:-1,y:0};
    else if(item.act==='right')pacman.ndir={x:1,y:0};
    else if(item.act==='ok'&&!alive)init();
  });
  const up=()=>b.classList.remove('pressed');
  b.addEventListener('pointerup',up);
  b.addEventListener('pointerleave',up);
  b.addEventListener('pointercancel',up);
  pad.appendChild(b);
});

let tx=0,ty=0;
c.addEventListener('touchstart',e=>{
  if(_inputLocked)return;
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:true});
c.addEventListener('touchend',e=>{
  if(_inputLocked)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.hypot(dx,dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))pacman.ndir={x:dx>0?1:-1,y:0};
  else pacman.ndir={x:0,y:dy>0?1:-1};
},{passive:true});

document.addEventListener('keydown',e=>{
  if(_inputLocked)return;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='ц'){e.preventDefault();pacman.ndir={x:0,y:-1};}
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='ы'){e.preventDefault();pacman.ndir={x:0,y:1};}
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ф'){e.preventDefault();pacman.ndir={x:-1,y:0};}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='в'){e.preventDefault();pacman.ndir={x:1,y:0};}
  else if(e.key==='Escape')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}
});

window.addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='input'){
    if(_inputLocked)return;
    if(d.act==='up')pacman.ndir={x:0,y:-1};
    else if(d.act==='down')pacman.ndir={x:0,y:1};
    else if(d.act==='left')pacman.ndir={x:-1,y:0};
    else if(d.act==='right')pacman.ndir={x:1,y:0};
    else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}
  }
});

/* ============ MODAL ============ */
function showModal(title,body,btn,next){
  _inputLocked=false;
  _clearAllTimers();
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent=title;m.appendChild(h);
  const p=document.createElement('p');p.innerHTML=body;m.appendChild(p);
  const row=document.createElement('div');row.className='row-btns';
  const b=document.createElement('button');
  b.textContent=btn;
  b.onclick=()=>{
    if(b.disabled)return;
    b.disabled=true;
    _lockInput(400);
    closeModal();next();
  };
  row.appendChild(b);
  const lvBtn=document.createElement('button');
  lvBtn.textContent='Уровни';lvBtn.className='ghost';
  lvBtn.onclick=()=>{
    if(lvBtn.disabled)return;
    lvBtn.disabled=true;
    closeModal();showLevels();
  };
  row.appendChild(lvBtn);
  m.appendChild(row);
  m.classList.add('show');
}
function closeModal(){$('msg').classList.remove('show');}

function showLevels(){
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent='🏆 Уровни';m.appendChild(h);
  const grid2=document.createElement('div');grid2.className='levels-grid';
  for(let i=1;i<=20;i++){
    const done=doneLevels.indexOf(i)!==-1;
    const locked=i>maxLevel;
    const cur=i===level;
    const el=document.createElement('div');
    el.className='lv-btn'+(done?' done':'')+(locked?' locked':'')+(cur?' current':'');
    el.textContent=(done?'✓ ':'')+i;
    if(!locked)el.onclick=()=>{
      if(_inputLocked)return;
      level=i;save();closeModal();init();
    };
    grid2.appendChild(el);
  }
  m.appendChild(grid2);
  const row=document.createElement('div');row.className='row-btns';
  const b=document.createElement('button');b.textContent='Закрыть';b.className='ghost';b.onclick=closeModal;
  row.appendChild(b);m.appendChild(row);
  m.classList.add('show');
}

function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),1500);
}

window.addEventListener('resize',()=>{try{resizeCanvas();render();}catch(e){}});
window.addEventListener('orientationchange',()=>{_safeTimeout(()=>{resizeCanvas();render();},200);});
window.addEventListener('blur',()=>{try{save();}catch(e){}});
window.addEventListener('beforeunload',()=>{try{save();_clearAllTimers();}catch(e){}});

level=Number(localStorage.getItem('pm_lv')||1);
init();
loop(performance.now());
})();
</script>
