<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pac-Man</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:10px;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;gap:8px}
.title{font-size:11px;letter-spacing:4px;color:rgba(200,220,255,.5);text-transform:uppercase}
.hud{width:min(94vw,380px);display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#9fb0d0}
.hud b{color:#ffd54a;font-size:13px;margin-left:4px}
canvas{width:min(94vw,380px);height:min(94vw,380px);border-radius:12px;background:#000;box-shadow:0 0 0 2px #1a2a4a,0 0 30px rgba(255,213,74,.15);touch-action:none;display:block}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:12px;font-weight:700;padding:8px 16px;border-radius:8px;border:2px solid #ffd54a;background:transparent;color:#ffd54a;cursor:pointer;letter-spacing:1px;touch-action:manipulation}
button:active{background:#ffd54a;color:#000}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:4px}
.dpad button{width:46px;height:46px;padding:0;font-size:18px;border-radius:10px;border:2px solid #2a3a5c;background:linear-gradient(180deg,#2a3a5c,#1a2540);color:#ffd54a;display:flex;align-items:center;justify-content:center}
.dpad .sp{visibility:hidden}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:24px;text-align:center}
.overlay.show{display:flex}
.overlay h2{color:#ffd54a;font-size:22px;letter-spacing:3px}
.overlay p{color:#9fb0d0;font-size:13px;line-height:1.7}
.overlay b{color:#fff;font-size:16px}
</style>
</head>
<body>
<div class="title">Pac-Man</div>
<div class="hud"><span>СЧЁТ<b id="score">0</b></span><span>УР.<b id="lvl">1</b></span><span>ЖИЗНИ<b id="lives">❤❤❤</b></span></div>
<canvas id="c" width="380" height="380"></canvas>
<div class="btns"><button id="bNew">Заново</button><button id="bExit">← Назад</button></div>
<div class="dpad">
<div class="sp"></div><button data-dir="up">▲</button><div class="sp"></div>
<button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
</div>
<div class="overlay" id="ov"><h2 id="ovT">Игра окончена</h2><p id="ovP"></p><button id="ovB">Ещё раз</button></div>
<script>
(function(){
'use strict';
const MAZES=[
["###################","#........#........#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.###.#.###.####","#..#.#.......#.#..#","#.##.# ##### #.##.#","#.......#GGG#.....#","#.##.# ##### #.##.#","#..#.#       #.#..#","####.###.#.###.####","#....#...#...#....#","#.##.#.#####.#.##.#","#o.......P.......o#","#.##.###.#.###.##.#","#.................#","###################"],
["###################","#o......#........o#","#.#####.#.#####.#.#","#.......#.......#.#","#.#####.#.#####.#.#","#.#...#.#.#...#.#.#","#.#.#.#.#.#.#.#.#.#","#...#...#...#...#.#","####.#####.#####.##","#....#..GGG..#....#","#.##.# ##### #.##.#","#.#..#       #..#.#","#.#.##.#####.##.#.#","#.#....#...#....#.#","#.##.#.#.#.#.#.##.#","#o...#.#...#.#...o#","####.#.##.##.#.####","#....#...#...#....#","###################"],
["###################","#o...............o#","#.##.#####.#####.##","#....#.......#....#","####.#.#####.#.####","#....#...#...#....#","#.##.#.#G#G#.#.##.#","#..#...#.#.#...#..#","#.##.##.#.#.##.##.#","#.....#.#G#.#.....#","#.##.##.#.#.##.##.#","#..#...#...#...#..#","#.##.#.#####.#.##.#","#....#...#...#....#","####.#.#####.#.####","#....#.......#....#","#.##.#####.#####.##","#o.....P........o.#","###################"],
["###################","#o......#####.....o","#.#####.#...#.#####","#.#...#.#.#.#.#...#","#.#.#.#.#.#.#.#.#.#","#...#...#...#...#.#","###.#####.###.###.#","#...#..GGGGG..#...#","#.#.# ##### #.#.#.#","#.#...#..P..#...#.#","#.#.# ##### #.#.#.#","#...#.......#...#.#","###.#####.###.###.#","#...#...#...#...#.#","#.#.#.#.#.#.#.#.#.#","#.#...#.#.#.#.#...#","#.#####.#...#.#####","#o......#####.....o","###################"],
["###################","#o.oo.o.......o.oo#","#.................#","#.#####.#####.###.#","#.#...#.#GGG#.#...#","#.#.#.#.#.#.#.#.#.#","#...#...#...#...#.#","#####.#####.#####.#","#.....#.....#.....#","#.###.#.###.#.###.#","#...#...#P#...#...#","#.#.#####.#####.#.#","#.#.......#.....#.#","#.#####.#.#.###.#.#","#.....#.#...#.#...#","#.###.#.#####.#.#.#","#o..#.#.......#.#o#","#...#.###.###.#...#","###################"]
];
const ROWS=19,COLS=19;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=cvs.width,H=cvs.height;
const CELL=Math.min(W/COLS,H/ROWS);
const OX=(W-COLS*CELL)/2,OY=(H-ROWS*CELL)/2;
let grid,pac,dir,nextDir,ghosts,score,lives,running,over,win,powerTimer,acc,last,pacAcc,ghostAcc,ghostsEatenInFright,pelletsLeft,level,levelClearTimer,currentLevelGhostMs;
const PAC_MS=140;
const GHOST_COLORS=['#ff5252','#ff8ac4','#66d9ff','#ffb84d'];
let hi=Number(localStorage.getItem('pacman_hi')||0);
function initLevel(lvl){
  const maze=MAZES[Math.min(lvl-1,MAZES.length-1)];
  grid=maze.map(row=>row.split(''));
  pelletsLeft=0;
  let px=9,py=15;
  const gpos=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=grid[y][x];
    if(c==='P'){px=x;py=y;grid[y][x]=' ';}
    else if(c==='G'){gpos.push({x,y});grid[y][x]=' ';}
    else if(c==='.'||c==='o')pelletsLeft++;
    else if(c===' '&&x>0&&x<COLS-1&&y>0&&y<ROWS-1){grid[y][x]=' ';}
  }
  pac={x:px,y:py};
  dir={x:0,y:0};nextDir={x:0,y:0};
  while(gpos.length<4)gpos.push({x:9,y:9});
  ghosts=gpos.slice(0,4).map((p,i)=>({
    x:p.x,y:p.y,color:GHOST_COLORS[i],dir:{x:(i%2===0?-1:1),y:0},
    scatter:[[18,0],[0,0],[18,18],[0,18]][i]
  }));
  powerTimer=0;ghostsEatenInFright=0;
  currentLevelGhostMs=Math.max(110,180-lvl*10);
  running=true;over=false;win=false;levelClearTimer=0;
  acc=0;last=0;pacAcc=0;ghostAcc=0;
  document.getElementById('ov').classList.remove('show');
  updateHUD();
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lvl').textContent=level;
  document.getElementById('lives').textContent='❤'.repeat(Math.max(0,lives));
}
function reset(full){
  if(full){score=0;lives=3;level=1;}
  initLevel(level);
}
function isWall(x,y){
  if(y<0||y>=ROWS||x<0||x>=COLS)return true;
  return grid[y][x]==='#';
}
function movePac(){
  if(nextDir.x||nextDir.y){
    const nx=pac.x+nextDir.x,ny=pac.y+nextDir.y;
    if(!isWall(nx,ny)){dir=nextDir;nextDir={x:0,y:0};}
  }
  if(dir.x||dir.y){
    const nx=pac.x+dir.x,ny=pac.y+dir.y;
    if(!isWall(nx,ny)){pac.x=nx;pac.y=ny;}
  }
  const c=grid[pac.y][pac.x];
  if(c==='.'){
    grid[pac.y][pac.x]=' ';score+=10;pelletsLeft--;
    if(score>hi){hi=score;localStorage.setItem('pacman_hi',hi);}
    updateHUD();checkWin();
  } else if(c==='o'){
    grid[pac.y][pac.x]=' ';score+=50;pelletsLeft--;
    powerTimer=7000;ghostsEatenInFright=0;
    updateHUD();checkWin();
  }
  checkGhostCollision();
}
function checkWin(){
  if(pelletsLeft<=0&&!win){
    running=false;win=true;
    if(level<MAZES.length){
      document.getElementById('ovT').textContent='Уровень '+level+' пройден!';
      document.getElementById('ovP').innerHTML='Следующий уровень...<br>Счёт: <b>'+score+'</b>';
      document.getElementById('ov').classList.add('show');
      setTimeout(()=>{
        level++;
        window.parent.postMessage({type:'addCoins',amount:Math.max(5,Math.floor(score/20))},'*');
        reset(false);
      },1600);
    } else {
      document.getElementById('ovT').textContent='🏆 ВСЕ УРОВНИ ПРОЙДЕНЫ!';
      document.getElementById('ovP').innerHTML='Счёт: <b>'+score+'</b><br>Ты — легенда!';
      document.getElementById('ov').classList.add('show');
      window.parent.postMessage({type:'addCoins',amount:Math.max(20,Math.floor(score/10))},'*');
    }
  }
}
function moveGhost(g){
  const opts=[];
  const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  for(const d of dirs){
    if(d.x===-g.dir.x&&d.y===-g.dir.y)continue;
    if(!isWall(g.x+d.x,g.y+d.y))opts.push(d);
  }
  let chosen=null;
  if(opts.length===0)chosen={x:-g.dir.x,y:-g.dir.y};
  else if(opts.length===1)chosen=opts[0];
  else{
    const chase=!powerTimer;
    const tx=chase?pac.x:g.scatter[0];
    const ty=chase?pac.y:g.scatter[1];
    let best=null,bd=Infinity;
    for(const d of opts){
      const dist=(g.x+d.x-tx)*(g.x+d.x-tx)+(g.y+d.y-ty)*(g.y+d.y-ty);
      if(dist<bd){bd=dist;best=d;}
    }
    chosen=best;
  }
  g.dir=chosen;g.x+=chosen.x;g.y+=chosen.y;
}
function checkGhostCollision(){
  for(const g of ghosts){
    if(g.x===pac.x&&g.y===pac.y){
      if(powerTimer>0){
        ghostsEatenInFright++;
        const pts=200*Math.pow(2,Math.min(3,ghostsEatenInFright-1));
        score+=pts;updateHUD();
        g.x=9;g.y=9;g.dir={x:0,y:-1};
      } else {
        lives--;
        updateHUD();
        if(lives<=0){
          running=false;over=true;
          document.getElementById('ovT').textContent='Игра окончена';
          document.getElementById('ovP').innerHTML='Уровень: <b>'+level+'</b><br>Счёт: <b>'+score+'</b>';
          document.getElementById('ov').classList.add('show');
          window.parent.postMessage({type:'addCoins',amount:Math.max(1,Math.floor(score/25))},'*');
        } else {
          pac={x:9,y:15};dir={x:0,y:0};nextDir={x:0,y:0};
          ghosts.forEach((g,i)=>{g.x=9+Math.min(i,2);g.y=9;g.dir={x:0,y:-1};});
          powerTimer=0;
        }
        return;
      }
    }
  }
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const c=grid[y][x];
      const px=OX+x*CELL,py=OY+y*CELL;
      if(c==='#'){
        ctx.fillStyle='#1a3a6a';
        ctx.fillRect(px,py,CELL,CELL);
        ctx.strokeStyle='#3a6ac0';ctx.lineWidth=1;
        ctx.strokeRect(px+0.5,py+0.5,CELL-1,CELL-1);
      } else if(c==='.'){
        ctx.fillStyle='#ffe8a0';
        ctx.beginPath();ctx.arc(px+CELL/2,py+CELL/2,CELL*0.09,0,Math.PI*2);ctx.fill();
      } else if(c==='o'){
        ctx.shadowColor='#ffe8a0';ctx.shadowBlur=10;
        ctx.fillStyle='#ffe8a0';
        ctx.beginPath();ctx.arc(px+CELL/2,py+CELL/2,CELL*0.22,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      }
    }
  }
  const pcx=OX+pac.x*CELL+CELL/2,pcy=OY+pac.y*CELL+CELL/2;
  ctx.fillStyle='#ffd54a';
  let ang=0;
  if(dir.x===1)ang=0;else if(dir.x===-1)ang=Math.PI;
  else if(dir.y===1)ang=Math.PI/2;else if(dir.y===-1)ang=-Math.PI/2;
  const mouth=0.25*Math.PI*(0.5+0.5*Math.sin(performance.now()/120));
  ctx.beginPath();
  ctx.moveTo(pcx,pcy);
  ctx.arc(pcx,pcy,CELL*0.42,ang+mouth,ang+Math.PI*2-mouth);
  ctx.closePath();
  ctx.fill();
  for(const g of ghosts){
    const gx=OX+g.x*CELL+CELL/2,gy=OY+g.y*CELL+CELL/2;
    let col=g.color;
    if(powerTimer>0)col=(Math.floor(performance.now()/200)%2===0)?'#3070ff':'#ffffff';
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(gx,gy-CELL*0.05,CELL*0.36,Math.PI,0);
    ctx.lineTo(gx+CELL*0.36,gy+CELL*0.35);
    ctx.lineTo(gx+CELL*0.18,gy+CELL*0.25);
    ctx.lineTo(gx,gy+CELL*0.35);
    ctx.lineTo(gx-CELL*0.18,gy+CELL*0.25);
    ctx.lineTo(gx-CELL*0.36,gy+CELL*0.35);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(gx-CELL*0.14,gy-CELL*0.08,CELL*0.10,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(gx+CELL*0.14,gy-CELL*0.08,CELL*0.10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(gx-CELL*0.14+g.dir.x*CELL*0.03,gy-CELL*0.08+g.dir.y*CELL*0.03,CELL*0.05,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(gx+CELL*0.14+g.dir.x*CELL*0.03,gy-CELL*0.08+g.dir.y*CELL*0.03,CELL*0.05,0,Math.PI*2);ctx.fill();
  }
}
function loop(t){
  const dt=t-(last||t);last=t;
  if(running){
    if(powerTimer>0)powerTimer=Math.max(0,powerTimer-dt);
    pacAcc+=dt;ghostAcc+=dt;
    while(pacAcc>=PAC_MS){pacAcc-=PAC_MS;movePac();if(!running)break;}
    if(running){
      while(ghostAcc>=currentLevelGhostMs){ghostAcc-=currentLevelGhostMs;for(const g of ghosts)moveGhost(g);}
      checkGhostCollision();
    }
  }
  draw();
  requestAnimationFrame(loop);
}
function setDir(x,y){nextDir={x,y};}
document.querySelectorAll('.dpad button').forEach(b=>{
  b.addEventListener('click',()=>{
    const d=b.dataset.dir;
    if(d==='up')setDir(0,-1);else if(d==='down')setDir(0,1);
    else if(d==='left')setDir(-1,0);else if(d==='right')setDir(1,0);
  });
});
let tx=0,ty=0;
cvs.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cvs.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.hypot(dx,dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'||k==='ц'){e.preventDefault();setDir(0,-1);}
  else if(k==='arrowdown'||k==='s'||k==='ы'){e.preventDefault();setDir(0,1);}
  else if(k==='arrowleft'||k==='a'||k==='ф'){e.preventDefault();setDir(-1,0);}
  else if(k==='arrowright'||k==='d'||k==='в'){e.preventDefault();setDir(1,0);}
});
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.type!=='input')return;
  if(d.act==='up')setDir(0,-1);else if(d.act==='down')setDir(0,1);
  else if(d.act==='left')setDir(-1,0);else if(d.act==='right')setDir(1,0);
  else if(d.act==='back'||d.act==='menu')window.parent.postMessage({type:'exit'},'*');
  else if(d.act==='ok'&&!running&&over)reset(true);
});
document.getElementById('bNew').addEventListener('click',()=>reset(true));
document.getElementById('ovB').addEventListener('click',()=>reset(true));
document.getElementById('bExit').addEventListener('click',()=>window.parent.postMessage({type:'exit'},'*'));
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
reset(true);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
