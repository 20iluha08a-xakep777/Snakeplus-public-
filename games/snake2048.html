<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake-2048</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;gap:10px}
.title{font-size:11px;letter-spacing:4px;color:rgba(200,220,255,.5);text-transform:uppercase}
.hud{width:min(94vw,360px);display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;color:#9fb0d0}
.hud b{color:#7ee8b0;font-size:14px;margin-left:4px}
canvas{width:min(94vw,360px);height:min(94vw,360px);border-radius:12px;background:#050a14;box-shadow:0 0 0 2px #2a3a5c,0 0 30px rgba(126,232,176,.15);touch-action:none;display:block}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:12px;font-weight:700;padding:9px 18px;border-radius:8px;border:2px solid #7ee8b0;background:transparent;color:#7ee8b0;cursor:pointer;letter-spacing:1px;touch-action:manipulation}
button:active{background:#7ee8b0;color:#06210f}
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:24px;text-align:center}
.overlay.show{display:flex}
.overlay h2{color:#7ee8b0;font-size:22px;letter-spacing:3px}
.overlay p{color:#9fb0d0;font-size:13px;line-height:1.7}
.overlay b{color:#fff;font-size:16px}
</style>
</head>
<body>
<div class="title">Snake-2048</div>
<div class="hud"><span>СЧЁТ<b id="score">0</b></span><span>ПЛИТКА<b id="val">2</b></span><span>РЕКОРД<b id="hi">0</b></span></div>
<canvas id="c" width="360" height="360"></canvas>
<div class="btns"><button id="bNew">Заново</button><button id="bExit">← Назад</button></div>
<div class="overlay" id="ov"><h2 id="ovT">Игра окончена</h2><p id="ovP"></p><button id="ovB">Ещё раз</button></div>
<script>
(function(){
'use strict';
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=360,H=360,G=15,CELL=W/G;
let snake,dir,dirQ,food,val,score,eats,running,dead,acc,last,tickMs;
let hi=Number(localStorage.getItem('snake2048_hi')||0);
document.getElementById('hi').textContent=hi;
function init(){
  snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];
  dir={x:1,y:0};dirQ=[];
  val=2;score=0;eats=0;running=true;dead=false;acc=0;last=0;tickMs=190;
  placeFood();
  document.getElementById('score').textContent='0';
  document.getElementById('val').textContent='2';
  document.getElementById('ov').classList.remove('show');
}
function placeFood(){
  for(let t=0;t<500;t++){
    const x=Math.floor(Math.random()*G),y=Math.floor(Math.random()*G);
    if(snake.some(s=>s.x===x&&s.y===y))continue;
    food={x,y};return;
  }
}
function setDir(x,y){
  if(!running)return;
  const r=dirQ.length?dirQ[dirQ.length-1]:dir;
  if(r.x===-x&&r.y===-y)return;
  if(r.x===x&&r.y===y)return;
  if(dirQ.length>=2)dirQ.shift();
  dirQ.push({x,y});
}
function step(){
  if(dirQ.length)dir=dirQ.shift();
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=G||h.y<0||h.y>=G)return die();
  for(let i=0;i<snake.length-1;i++)if(snake[i].x===h.x&&snake[i].y===h.y)return die();
  const ate=(h.x===food.x&&h.y===food.y);
  snake.unshift(h);
  if(ate){
    score+=val;eats++;
    document.getElementById('score').textContent=score;
    document.getElementById('val').textContent=val;
    if(score>hi){hi=score;localStorage.setItem('snake2048_hi',hi);document.getElementById('hi').textContent=hi;}
    val=val<2048?val*2:2;
    placeFood();
    tickMs=Math.max(80,tickMs-3);
  } else snake.pop();
}
function die(){
  running=false;dead=true;
  document.getElementById('ovT').textContent='Игра окончена';
  document.getElementById('ovP').innerHTML='Счёт: <b>'+score+'</b><br>Яблок съедено: <b>'+eats+'</b>';
  document.getElementById('ov').classList.add('show');
  const reward=Math.max(1,Math.floor(score/15));
  if(reward>0)window.parent.postMessage({type:'addCoins',amount:reward},'*');
}
function draw(){
  ctx.fillStyle='#050a14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(126,232,176,.05)';ctx.lineWidth=1;
  for(let i=1;i<G;i++){
    ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(W,i*CELL);ctx.stroke();
  }
  if(food){
    const cx=food.x*CELL+CELL/2,cy=food.y*CELL+CELL/2;
    ctx.shadowColor='#7ee8b0';ctx.shadowBlur=18;
    ctx.fillStyle='#7ee8b0';
    ctx.beginPath();ctx.arc(cx,cy,CELL*0.38,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#06210f';
    ctx.font='bold '+(CELL*0.42)+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(val),cx,cy+1);
  }
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i],t=i/Math.max(snake.length-1,1);
    const r=CELL*0.42-t*0.05;
    if(i===0){ctx.shadowColor='#7ee8b0';ctx.shadowBlur=14;ctx.fillStyle='#a8ffd0';}
    else ctx.fillStyle='hsl('+(150+t*30)+','+(70-t*25)+'%,'+(60-t*22)+'%)';
    ctx.beginPath();
    const cx=s.x*CELL+CELL/2,cy=s.y*CELL+CELL/2;
    if(ctx.roundRect)ctx.roundRect(cx-r,cy-r,r*2,r*2,r*0.5);
    else ctx.rect(cx-r,cy-r,r*2,r*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
}
function loop(t){
  const dt=t-(last||t);last=t;
  if(running){
    acc+=dt;
    while(acc>=tickMs){acc-=tickMs;step();if(!running)break;}
  }
  draw();
  requestAnimationFrame(loop);
}
let tx=0,ty=0;
cvs.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cvs.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.hypot(dx,dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'||k==='ц'){e.preventDefault();setDir(0,-1);}
  else if(k==='arrowdown'||k==='s'||k==='ы'){e.preventDefault();setDir(0,1);}
  else if(k==='arrowleft'||k==='a'||k==='ф'){e.preventDefault();setDir(-1,0);}
  else if(k==='arrowright'||k==='d'||k==='в'){e.preventDefault();setDir(1,0);}
});
document.getElementById('bNew').addEventListener('click',init);
document.getElementById('ovB').addEventListener('click',init);
document.getElementById('bExit').addEventListener('click',()=>window.parent.postMessage({type:'exit'},'*'));
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
init();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
