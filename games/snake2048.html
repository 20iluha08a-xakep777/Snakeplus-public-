<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake-2048</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding:6px;gap:5px}
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(200,220,255,.5);padding:2px 8px;flex-shrink:0}
.hdr b{color:#7ee8b0;font-size:12px;margin-left:3px}
.hdr .coins{font-size:11px;color:#ffd54a;font-weight:800}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{background:#050a14;border-radius:14px;box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 0 1.5px rgba(126,232,176,.25);display:block;touch-action:none;max-width:100%;max-height:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;max-width:190px;width:62vw;margin:0 auto;flex-shrink:0}
.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:10px;color:#cfe0ff;font-size:20px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer;touch-action:none;transition:transform .08s;user-select:none;display:flex;align-items:center;justify-content:center}
.pad button:active,.pad button.pressed{color:#7ee8b0;border-color:#7ee8b0;transform:scale(.94)}
.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a);font-size:13px}
.msg{position:fixed;inset:0;background:rgba(5,10,20,.94);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:100}
.msg.show{display:flex}
.msg h2{color:#7ee8b0;font-size:22px;letter-spacing:2px;text-transform:uppercase}
.msg p{font-size:13px;color:rgba(200,220,255,.8);line-height:1.7;max-width:300px}
.msg .row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg button{font:inherit;font-size:13px;font-weight:800;padding:12px 22px;border:2px solid #7ee8b0;border-radius:10px;background:linear-gradient(180deg,#8ff5bd,#48c98a);color:#06210f;cursor:pointer;letter-spacing:1px;text-transform:uppercase;min-width:110px;transition:opacity .15s}
.msg button:disabled{opacity:.5;cursor:default}
.msg button.ghost{background:transparent;color:#7ee8b0}
.levels-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:320px;max-height:70vh;overflow-y:auto;padding:4px;margin-top:6px}
.lv-btn{aspect-ratio:1;border-radius:10px;border:1.5px solid rgba(126,232,176,.3);background:rgba(126,232,176,.05);color:#7ee8b0;font:inherit;font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation}
.lv-btn.done{background:linear-gradient(180deg,rgba(126,232,176,.3),rgba(72,201,138,.15));border-color:#7ee8b0}
.lv-btn.locked{opacity:.35;cursor:default}
.lv-btn.current{border-color:#ffd54a;box-shadow:0 0 0 2px rgba(255,213,74,.3)}
.lv-btn .check{position:absolute;top:2px;right:4px;font-size:11px;color:#7ee8b0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-150%);background:#7ee8b0;color:#06210f;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:800;z-index:200;transition:all .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span>Ур.<b id="lv">1</b> · Ходы<b id="mv">0/100</b> · Цель<b id="goal">64</b></span>
    <span class="coins">💰 <span id="coins">0</span></span>
  </div>
  <div class="stage"><canvas id="c" width="320" height="320"></canvas></div>
  <div class="pad" id="pad"></div>
</div>
<div class="msg" id="msg"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const c=$('c'),ctx=c.getContext('2d');
const GRID=4,CELL=c.width/GRID;

/* ============ ANTI-LAG SYSTEM ============ */
let _gen=0;
let _timers=[];
let _inputLocked=false;
let _initializing=false;
function _safeTimeout(fn,ms){
  const id=setTimeout(()=>{_timers=_timers.filter(t=>t!==id);fn();},ms);
  _timers.push(id);
  return id;
}
function _safeInterval(fn,ms){
  const id=setInterval(fn,ms);
  _timers.push(id);
  return id;
}
function _clearAllTimers(){
  _timers.forEach(id=>{clearTimeout(id);clearInterval(id);});
  _timers=[];
}
function _lockInput(ms){
  _inputLocked=true;
  _safeTimeout(()=>{_inputLocked=false;},ms||400);
}

/* ============ GAME ============ */
let board,score=0,moves=0;
let level=Number(localStorage.getItem('s2048_lv')||1);
let alive=true;
let totalCoins=Number(localStorage.getItem('s2048_coins')||0);
let maxLevel=Number(localStorage.getItem('s2048_maxlv')||1);
let doneLevels=(()=>{try{return JSON.parse(localStorage.getItem('s2048_done')||'[]');}catch(e){return[];}})();

const LV=[];
for(let i=1;i<=20;i++)LV.push({g:Math.pow(2,6+i-1),m:80+i*20});

function lvCfg(){return LV[Math.min(level-1,LV.length-1)];}

function save(){
  localStorage.setItem('s2048_coins',totalCoins);
  localStorage.setItem('s2048_maxlv',maxLevel);
  localStorage.setItem('s2048_done',JSON.stringify(doneLevels));
  localStorage.setItem('s2048_lv',level);
  postProgress();
}
function postCoins(n){try{window.parent.postMessage({type:'addCoins',amount:n},'*');}catch(e){}}
function postProgress(){try{window.parent.postMessage({type:'gameProgress',game:'snake2048',level:level,coins:totalCoins,done:doneLevels},'*');}catch(e){}}

function col(v){
  const m={2:'#a8ffd0',4:'#7ee8b0',8:'#48c98a',16:'#2eaa74',32:'#1d8a5c',64:'#ffd54a',128:'#ffb300',256:'#ff8a65',512:'#ff5757',1024:'#b07ee8',2048:'#3a7ee8',4096:'#66d9ff',8192:'#00ffee'};
  return m[v]||(v>=16384?'#ffffff':'#0d1526');
}

function init(){
  if(_initializing)return;
  _initializing=true;
  _gen++;
  _clearAllTimers();
  _inputLocked=false;

  board=Array.from({length:GRID},()=>Array(GRID).fill(0));
  moves=0;score=0;alive=true;
  spawn();spawn();
  render();
  _initializing=false;
}

function empty(){
  for(let r=0;r<GRID;r++)for(let k=0;k<GRID;k++)if(!board[r][k])return{r,c:k};
  return null;
}
function spawn(){
  const e=empty();
  if(e)board[e.r][e.c]=Math.random()<0.9?2:4;
}
function slide(row){
  let a=row.filter(v=>v);
  for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a[i+1]=0;}
  a=a.filter(v=>v);
  while(a.length<GRID)a.push(0);
  return a;
}
function best(){
  let m=0;
  for(const r of board)for(const v of r)if(v>m)m=v;
  return m;
}
function canMove(){
  for(let r=0;r<GRID;r++)for(let k=0;k<GRID;k++){
    if(!board[r][k])return true;
    if(k<GRID-1&&board[r][k]===board[r][k+1])return true;
    if(r<GRID-1&&board[r][k]===board[r+1][k])return true;
  }
  return false;
}
function check(){
  const b=best();
  if(b>=lvCfg().g){
    alive=false;_lockInput(600);
    if(doneLevels.indexOf(level)===-1)doneLevels.push(level);
    const r=20+level*15;
    totalCoins+=r;
    postCoins(r);
    if(level+1>maxLevel)maxLevel=level+1;
    save();
    playBeep(800);
    showModal('🎉 Уровень пройден!','Цель '+lvCfg().g+'!<br>+'+r+'💰','Дальше',()=>{level++;save();init();});
    return;
  }
  if(moves>=lvCfg().m||!canMove()){
    alive=false;_lockInput(600);
    playBeep(200);
    showModal('😔 Игра окончена','Максимум: '+b+'<br>Ходы: '+moves+'/'+lvCfg().m,'Заново',()=>{init();});
  }
}
function move(d){
  if(!alive||_inputLocked)return;
  const before=JSON.stringify(board);
  if(d==='l')board=board.map(r=>slide(r));
  else if(d==='r')board=board.map(r=>slide(r.reverse()).reverse());
  else{
    for(let k=0;k<GRID;k++){
      let col2=board.map(r=>r[k]);
      if(d==='u')col2=slide(col2);
      else col2=slide(col2.reverse()).reverse();
      for(let r=0;r<GRID;r++)board[r][k]=col2[r];
    }
  }
  if(JSON.stringify(board)!==before){
    moves++;
    spawn();
    render();
    check();
  }
}
function render(){
  ctx.fillStyle='#050a14';
  ctx.fillRect(0,0,c.width,c.height);
  for(let r=0;r<GRID;r++)for(let k=0;k<GRID;k++){
    const v=board[r][k];
    const x=k*CELL+3,y=r*CELL+3,w=CELL-6,h=CELL-6;
    ctx.fillStyle=v?col(v):'rgba(255,255,255,.04)';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,w,h,8);
    else ctx.rect(x,y,w,h);
    ctx.fill();
    if(v){
      ctx.fillStyle='#06210f';
      ctx.font='bold '+(v>=10000?14:v>=1000?18:v>=100?22:26)+'px system-ui';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(v,x+w/2,y+h/2+1);
    }
  }
  $('lv').textContent=level;
  $('mv').textContent=moves+'/'+lvCfg().m;
  $('goal').textContent=lvCfg().g;
  $('coins').textContent=totalCoins;
}

/* ============ INPUT ============ */
const pad=$('pad');
const layout=[
  {},{act:'up',label:'▲'},{},
  {act:'left',label:'◀'},{act:'ok',label:'OK',cls:'ok'},{act:'right',label:'▶'},
  {},{act:'down',label:'▼'},{}
];
layout.forEach(item=>{
  const b=document.createElement('button');
  if(!item.act){b.style.visibility='hidden';pad.appendChild(b);return;}
  b.textContent=item.label;
  if(item.cls)b.className=item.cls;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    b.classList.add('pressed');
    if(item.act==='up')move('u');
    else if(item.act==='down')move('d');
    else if(item.act==='left')move('l');
    else if(item.act==='right')move('r');
    else if(item.act==='ok'){
      if(!alive){init();}
    }
  });
  const up=()=>b.classList.remove('pressed');
  b.addEventListener('pointerup',up);
  b.addEventListener('pointerleave',up);
  b.addEventListener('pointercancel',up);
  pad.appendChild(b);
});

let sx=0,sy=0;
c.addEventListener('touchstart',e=>{
  if(_inputLocked)return;
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
c.addEventListener('touchend',e=>{
  if(_inputLocked)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.hypot(dx,dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'r':'l');
  else move(dy>0?'d':'u');
},{passive:true});

document.addEventListener('keydown',e=>{
  if(_inputLocked)return;
  const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'}[e.key];
  if(k){e.preventDefault();move(k);}
  else if(e.key==='Escape')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}
});

window.addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='input'){
    if(_inputLocked)return;
    if(d.act==='left')move('l');
    else if(d.act==='right')move('r');
    else if(d.act==='up')move('u');
    else if(d.act==='down')move('d');
    else if(d.act==='ok'&&!alive)init();
    else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}
  }
});

/* ============ MODAL ============ */
function showModal(title,body,btn,next){
  if(_inputLocked)return;
  _lockInput(300);
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent=title;m.appendChild(h);
  const p=document.createElement('p');p.innerHTML=body;m.appendChild(p);
  const row=document.createElement('div');row.className='row-btns';
  const b=document.createElement('button');
  b.textContent=btn;
  b.onclick=()=>{
    if(b.disabled)return;
    b.disabled=true;
    setTimeout(()=>{b.disabled=false;},500);
    closeModal();
    next();
  };
  row.appendChild(b);
  const lvBtn=document.createElement('button');
  lvBtn.textContent='Уровни';lvBtn.className='ghost';
  lvBtn.onclick=()=>{
    if(lvBtn.disabled)return;
    lvBtn.disabled=true;
    setTimeout(()=>{lvBtn.disabled=false;},500);
    closeModal();
    showLevels();
  };
  row.appendChild(lvBtn);
  m.appendChild(row);
  m.classList.add('show');
}
function closeModal(){$('msg').classList.remove('show');}

function showLevels(){
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent='🏆 Уровни';m.appendChild(h);
  const grid=document.createElement('div');grid.className='levels-grid';
  for(let i=1;i<=20;i++){
    const done=doneLevels.indexOf(i)!==-1;
    const locked=i>maxLevel;
    const cur=i===level;
    const el=document.createElement('div');
    el.className='lv-btn'+(done?' done':'')+(locked?' locked':'')+(cur?' current':'');
    el.textContent=(done?'✓ ':'')+i;
    if(!locked)el.onclick=()=>{
      if(_inputLocked)return;
      level=i;save();closeModal();init();
    };
    grid.appendChild(el);
  }
  m.appendChild(grid);
  const row=document.createElement('div');row.className='row-btns';
  const b=document.createElement('button');b.textContent='Закрыть';b.className='ghost';b.onclick=closeModal;
  row.appendChild(b);m.appendChild(row);
  m.classList.add('show');
}

/* ============ UTILS ============ */
let audioCtx=null;
function playBeep(freq){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.frequency.value=freq;
    g.gain.setValueAtTime(0.06,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);
    o.connect(g).connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.15);
  }catch(e){}
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),1500);
}

window.addEventListener('blur',()=>{try{save();}catch(e){}});
window.addEventListener('beforeunload',()=>{try{save();_clearAllTimers();}catch(e){}});

init();
})();
</script>
</body>
</html>
