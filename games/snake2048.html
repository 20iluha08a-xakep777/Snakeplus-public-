<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake-2048</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;padding:8px;gap:8px}.hud{display:flex;gap:14px;font-size:11px;letter-spacing:1px;color:rgba(200,220,255,.6);text-transform:uppercase}.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}.wrap{position:relative;display:flex}.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.94);border-radius:10px;gap:12px;padding:20px;text-align:center;z-index:10}.msg.show{display:flex}.msg h2{color:#7ee8b0;font-size:20px;letter-spacing:2px}.msg p{font-size:12px;color:rgba(200,220,255,.75);line-height:1.6}.msg button{font:inherit;font-size:13px;font-weight:700;padding:10px 22px;border:2px solid #7ee8b0;border-radius:8px;background:#7ee8b0;color:#06210f;cursor:pointer;letter-spacing:1px}.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;max-width:180px;width:58vw}.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:8px;color:#cfe0ff;font-size:16px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer}.pad button:active{color:#7ee8b0;border-color:#7ee8b0}.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a)}</style></head><body>
<div class="hud"><span>Ур.<b id="lv">1</b></span><span>Ходы<b id="mv">0/80</b></span><span>Цель<b id="goal">64</b></span><span>💰<b id="coins">0</b></span></div>
<div class="wrap"><canvas id="c" width="320" height="320"></canvas><div class="msg" id="msg"></div></div>
<div class="pad" id="pad"></div>
<script>(function(){const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),GRID=4,CELL=c.width/GRID;
let board,score=0,moves=0,level=Number(localStorage.getItem('s2048_lv')||1),alive=true,totalCoins=Number(localStorage.getItem('s2048_coins')||0);
const LV=[{g:64,m:100},{g:128,m:140},{g:256,m:180},{g:512,m:220},{g:1024,m:260},{g:2048,m:300},{g:4096,m:400},{g:8192,m:500},{g:16384,m:600},{g:32768,m:800},{g:65536,m:1000},{g:131072,m:1200},{g:262144,m:1500},{g:524288,m:1800},{g:1048576,m:2200},{g:2097152,m:2600},{g:4194304,m:3000},{g:8388608,m:3500},{g:16777216,m:4000},{g:33554432,m:5000}];
const lvCfg=()=>LV[Math.min(level-1,LV.length-1)];
function col(v){const m={2:'#a8ffd0',4:'#7ee8b0',8:'#48c98a',16:'#2eaa74',32:'#1d8a5c',64:'#ffd54a',128:'#ffb300',256:'#ff8a65',512:'#ff5757',1024:'#b07ee8',2048:'#3a7ee8',4096:'#66d9ff',8192:'#00ffee'};return m[v]||(v>=16384?'#ffffff':'#0d1526');}
function empty(){for(let r=0;r<GRID;r++)for(let k=0;k<GRID;k++)if(!board[r][k])return{r,c:k};return null;}
function spawn(){const e=empty();if(e)board[e.r][e.c]=Math.random()<0.9?2:4;}
function init(){board=Array.from({length:GRID},()=>Array(GRID).fill(0));moves=0;alive=true;spawn();spawn();render();}
function slide(row){let a=row.filter(v=>v);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a[i+1]=0;}a=a.filter(v=>v);while(a.length<GRID)a.push(0);return a;}
function best(){let m=0;for(const r of board)for(const v of r)if(v>m)m=v;return m;}
function canMove(){for(let r=0;r<GRID;r++)for(let k=0;k<GRID;k++){if(!board[r][k])return true;if(k<GRID-1&&board[r][k]===board[r][k+1])return true;if(r<GRID-1&&board[r][k]===board[r+1][k])return true;}return false;}
function check(){const b=best();if(b>=lvCfg().g){const r=20+level*10;totalCoins+=r;localStorage.setItem('s2048_coins',totalCoins);if(level+1>Number(localStorage.getItem('s2048_maxlv')||1))localStorage.setItem('s2048_maxlv',level+1);try{window.parent.postMessage({type:'addCoins',amount:r},'*');}catch(e){}level++;localStorage.setItem('s2048_lv',level);show('🎉 +'+r+'💰','Цель '+lvCfg().g+'! Уровень '+level,'Дальше',init);return;}if(moves>=lvCfg().m||!canMove()){alive=false;level=1;localStorage.setItem('s2048_lv',1);show('😔 Игра окончена','Максимум: '+b+'<br>Начинаем с 1-го','Ещё раз',init);}}
function show(t,p,btn,next){const m=$('msg');m.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';m.classList.add('show');const b=document.createElement('button');b.textContent=btn;b.onclick=()=>{m.classList.remove('show');next();};m.appendChild(b);}
function move(d){if(!alive)return;const before=JSON.stringify(board);if(d==='l')board=board.map(r=>slide(r));else if(d==='r')board=board.map(r=>slide(r.reverse()).reverse());else{for(let k=0;k<GRID;k++){let col=board.map(r=>r[k]);if(d==='u')col=slide(col);else col=slide(col.reverse()).reverse();for(let r=0;r<GRID;r++)board[r][k]=col[r];}}if(JSON.stringify(board)!==before){moves++;spawn();render();check();}}
function render(){ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);for(let r=0;r<GRID;r++)for(let k=0;k<GRID;k++){const v=board[r][k],x=k*CELL+3,y=r*CELL+3,w=CELL-6,h=CELL-6;ctx.fillStyle=v?col(v):'rgba(255,255,255,.04)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,8);else ctx.rect(x,y,w,h);ctx.fill();if(v){ctx.fillStyle='#06210f';ctx.font='bold '+(v>=10000?14:v>=1000?18:v>=100?22:26)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,x+w/2,y+h/2+1);}}$('lv').textContent=level;$('mv').textContent=moves+'/'+lvCfg().m;$('goal').textContent=lvCfg().g;$('coins').textContent=totalCoins;}
const pad=$('pad');[{},{l:'▲',d:'u'},{},{l:'◀',d:'l'},{l:'OK',ok:1},{l:'▶',d:'r'},{},{l:'▼',d:'d'},{}].forEach(it=>{const b=document.createElement('button');b.textContent=it.l||'';if(it.ok)b.className='ok';b.addEventListener('click',()=>{if(it.ok){if(!alive)init();}else if(it.d)move(it.d);});pad.appendChild(b);});
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.hypot(dx,dy)<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));},{passive:true});
document.addEventListener('keydown',e=>{const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'}[e.key];if(k){e.preventDefault();move(k);}});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='input'){if(d.act==='left')move('l');else if(d.act==='right')move('r');else if(d.act==='up')move('u');else if(d.act==='down')move('d');else if(d.act==='ok'&&!alive)init();else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}}});
init();})();</script></body></html>
