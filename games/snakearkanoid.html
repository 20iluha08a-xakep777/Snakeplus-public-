<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake Arkanoid</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;padding:8px;gap:8px}.hud{display:flex;gap:14px;font-size:11px;letter-spacing:1px;color:rgba(200,220,255,.6);text-transform:uppercase}.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}.wrap{position:relative;display:flex}.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.94);border-radius:10px;gap:12px;padding:20px;text-align:center;z-index:10}.msg.show{display:flex}.msg h2{color:#7ee8b0;font-size:20px}.msg p{font-size:12px;color:rgba(200,220,255,.75);line-height:1.6}.msg button{font:inherit;font-size:13px;font-weight:700;padding:10px 22px;border:2px solid #7ee8b0;border-radius:8px;background:#7ee8b0;color:#06210f;cursor:pointer}.pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;max-width:260px;width:80vw}.pad button{padding:14px;font:inherit;border:1.5px solid #2a3a5c;border-radius:8px;color:#cfe0ff;font-size:16px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer}.pad button:active{color:#7ee8b0;border-color:#7ee8b0}.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a)}</style></head><body>
<div class="hud"><span>Ур.<b id="lv">1</b></span><span>Очки<b id="sc">0</b></span><span>Жизни<b id="hp">3</b></span><span>💰<b id="coins">0</b></span></div>
<div class="wrap"><canvas id="c" width="360" height="440"></canvas><div class="msg" id="msg"></div></div>
<div class="pad" id="pad"></div>
<script>(function(){const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');
let paddleX,paddleW,ball,bricks,score,lives,level,alive,keys={l:false,r:false};
let totalCoins=Number(localStorage.getItem('arka_coins')||0);
const COLORS=['#7ee8b0','#66d9ff','#ffd54a','#ff8a65','#b07ee8','#ff5757'];
function init(){paddleW=80;paddleX=c.width/2-paddleW/2;ball={x:c.width/2,y:c.height-80,dx:2.5,dy:-3,r:7,stuck:true};bricks=[];score=score||0;lives=lives||3;alive=true;
const rows=4+Math.min(Math.floor((level-1)/2),4),cols=8;
for(let r=0;r<rows;r++)for(let k=0;k<cols;k++)bricks.push({x:15+k*40,y:60+r*22,w:36,h:18,color:COLORS[r%COLORS.length],hp:1+Math.floor(r/2)});
render();}
function show(t,p,b,n){const m=$('msg');m.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';m.classList.add('show');const bt=document.createElement('button');bt.textContent=b;bt.onclick=()=>{m.classList.remove('show');n();};m.appendChild(bt);}
function step(){if(!alive)return;
if(keys.l)paddleX-=6;if(keys.r)paddleX+=6;
if(paddleX<0)paddleX=0;if(paddleX+paddleW>c.width)paddleX=c.width-paddleW;
if(ball.stuck){ball.x=paddleX+paddleW/2;ball.y=c.height-30;}
else{ball.x+=ball.dx;ball.y+=ball.dy;
if(ball.x-ball.r<0){ball.x=ball.r;ball.dx=-ball.dx;}
if(ball.x+ball.r>c.width){ball.x=c.width-ball.r;ball.dx=-ball.dx;}
if(ball.y-ball.r<0){ball.y=ball.r;ball.dy=-ball.dy;}
if(ball.y+ball.r>c.height){lives--;if(lives<=0){alive=false;level=1;localStorage.setItem('arka_lv',1);show('💀 Игра окончена','Очки: '+score,'Заново',()=>{score=0;lives=3;init();});return;}ball.stuck=true;ball.dx=2.5;ball.dy=-3;score=score||0;}
if(ball.y+ball.r>c.height-20&&ball.y+ball.r<c.height-10&&ball.x>paddleX&&ball.x<paddleX+paddleW&&ball.dy>0){ball.dy=-Math.abs(ball.dy);ball.dx=(ball.x-(paddleX+paddleW/2))/10*3;}
for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp--;score+=10;const overlapX=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));const overlapY=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));if(overlapX<overlapY)ball.dx=-ball.dx;else ball.dy=-ball.dy;if(b.hp<=0)bricks.splice(i,1);break;}}
if(!bricks.length){const r=25+level*12;totalCoins+=r;localStorage.setItem('arka_coins',totalCoins);try{window.parent.postMessage({type:'addCoins',amount:r},'*');}catch(e){}level++;localStorage.setItem('arka_lv',level);show('🎉 Уровень пройден!','+'+r+'💰','Дальше',init);}}
}
function render(){ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
for(const b of bricks){ctx.fillStyle=b.color;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(b.x,b.y,b.w,b.h,4);else ctx.rect(b.x,b.y,b.w,b.h);ctx.fill();ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(b.x+2,b.y+2,b.w-4,b.h-4);ctx.fillStyle=b.color;ctx.fillRect(b.x+4,b.y+4,b.w-8,b.h-8);}
ctx.fillStyle='#7ee8b0';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(paddleX,c.height-20,paddleW,12,6);else ctx.rect(paddleX,c.height-20,paddleW,12);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
$('lv').textContent=level;$('sc').textContent=score;$('hp').textContent=lives;$('coins').textContent=totalCoins;}
let last=0;function loop(t){const dt=Math.min(t-last,50);last=t;step();render();if(alive)requestAnimationFrame(loop);}
const pad=$('pad');[{l:'◀',a:'l'},{l:'↺',a:'reset'},{l:'▶',a:'r'}].forEach(it=>{const b=document.createElement('button');b.textContent=it.l;if(it.a==='reset')b.className='ok';
b.addEventListener('pointerdown',()=>{if(it.a==='l')keys.l=true;if(it.a==='r')keys.r=true;if(it.a==='reset'&&ball.stuck){ball.stuck=false;}});
b.addEventListener('pointerup',()=>{if(it.a==='l')keys.l=false;if(it.a==='r')keys.r=false;});
b.addEventListener('pointerleave',()=>{if(it.a==='l')keys.l=false;if(it.a==='r')keys.r=false;});
b.addEventListener('click',()=>{if(it.a==='reset'&&ball.stuck)ball.stuck=false;});
pad.appendChild(b);});
c.addEventListener('touchstart',e=>{if(ball.stuck){ball.stuck=false;return;}const rect=c.getBoundingClientRect();const tx=e.touches[0].clientX-rect.left;paddleX=Math.max(0,Math.min(c.width-paddleW,tx-paddleW/2));},{passive:true});
c.addEventListener('touchmove',e=>{const rect=c.getBoundingClientRect();const tx=e.touches[0].clientX-rect.left;paddleX=Math.max(0,Math.min(c.width-paddleW,tx-paddleW/2));},{passive:true});
c.addEventListener('click',()=>{if(ball.stuck)ball.stuck=false;});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();keys.l=true;}else if(e.key==='ArrowRight'){e.preventDefault();keys.r=true;}else if(e.key===' '){e.preventDefault();if(ball.stuck)ball.stuck=false;}});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false;});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='input'){if(d.act==='left'){keys.l=true;setTimeout(()=>keys.l=false,200);}else if(d.act==='right'){keys.r=true;setTimeout(()=>keys.r=false,200);}else if(d.act==='ok'||d.act==='a'){if(ball.stuck)ball.stuck=false;}else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}}});
level=Number(localStorage.getItem('arka_lv')||1);score=0;lives=3;init();requestAnimationFrame(loop);})();</script></body></html>
