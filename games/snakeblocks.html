<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake Blocks</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;padding:8px;gap:8px}.hud{display:flex;gap:14px;font-size:11px;letter-spacing:1px;color:rgba(200,220,255,.6);text-transform:uppercase}.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}.wrap{position:relative;display:flex}.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.94);border-radius:10px;gap:12px;padding:20px;text-align:center;z-index:10}.msg.show{display:flex}.msg h2{color:#7ee8b0;font-size:20px}.msg p{font-size:12px;color:rgba(200,220,255,.75);line-height:1.6}.msg button{font:inherit;font-size:13px;font-weight:700;padding:10px 22px;border:2px solid #7ee8b0;border-radius:8px;background:#7ee8b0;color:#06210f;cursor:pointer}.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;max-width:180px;width:58vw}.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:8px;color:#cfe0ff;font-size:16px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer}.pad button:active{color:#7ee8b0;border-color:#7ee8b0}.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a)}</style></head><body>
<div class="hud"><span>Ур.<b id="lv">1</b></span><span>Ходы<b id="mv">0</b></span><span>Собрано<b id="cl">0/3</b></span><span>💰<b id="coins">0</b></span></div>
<div class="wrap"><canvas id="c" width="380" height="380"></canvas><div class="msg" id="msg"></div></div>
<div class="pad" id="pad"></div>
<script>(function(){const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');
const S=10,CELL=c.width/S;
let snake,dir,blocks,collected,targets,moves,alive,level;
let totalCoins=Number(localStorage.getItem('blocks_coins')||0);
function init(){snake=[{x:1,y:1}];dir={x:1,y:0};collected=0;moves=0;alive=true;targets=[];blocks=[];
const count=3+Math.min(level-1,5);
for(let i=0;i<count;i++){let pos;do{pos={x:1+Math.floor(Math.random()*(S-2)),y:1+Math.floor(Math.random()*(S-2))};}while(snake.some(s=>s.x===pos.x&&s.y===pos.y)||targets.some(t=>t.x===pos.x&&t.y===pos.y));targets.push({...pos,collected:false});}
const bcount=Math.min(level,6);for(let i=0;i<bcount;i++){let pos;do{pos={x:1+Math.floor(Math.random()*(S-2)),y:1+Math.floor(Math.random()*(S-2))};}while(snake.some(s=>s.x===pos.x&&s.y===pos.y)||targets.some(t=>t.x===pos.x&&t.y===pos.y)||blocks.some(b=>b.x===pos.x&&b.y===pos.y));blocks.push(pos);}
render();}
function show(t,p,b,n){const m=$('msg');m.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';m.classList.add('show');const bt=document.createElement('button');bt.textContent=b;bt.onclick=()=>{m.classList.remove('show');n();};m.appendChild(bt);}
function move(dx,dy){if(!alive)return;const head=snake[0];const nx=head.x+dx,ny=head.y+dy;
if(nx<0||ny<0||nx>=S||ny>=S){alive=false;level=1;localStorage.setItem('blocks_lv',1);show('🚫 В стену!','Ходы: '+moves,'Заново',init);return;}
if(blocks.some(b=>b.x===nx&&b.y===ny))return;
if(snake.some(s=>s.x===nx&&s.y===ny))return;
snake.unshift({x:nx,y:ny});snake.pop();moves++;dir={x:dx,y:dy};
const t=targets.find(t=>!t.collected&&t.x===nx&&t.y===ny);if(t){t.collected=true;collected++;}
if(collected>=targets.length){const r=20+level*8;totalCoins+=r;localStorage.setItem('blocks_coins',totalCoins);try{window.parent.postMessage({type:'addCoins',amount:r},'*');}catch(e){}level++;localStorage.setItem('blocks_lv',level);show('🎉 Уровень пройден!','+'+r+'💰<br>Ходы: '+moves,'Дальше',init);return;}
render();}
function render(){ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
for(let y=0;y<S;y++)for(let x=0;x<S;x++){ctx.fillStyle=(x+y)%2?'rgba(255,255,255,.02)':'rgba(255,255,255,.04)';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);}
for(const b of blocks){ctx.fillStyle='#22304d';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(b.x*CELL+2,b.y*CELL+2,CELL-4,CELL-4,4);else ctx.rect(b.x*CELL+2,b.y*CELL+2,CELL-4,CELL-4);ctx.fill();}
for(const t of targets){if(t.collected)continue;ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(t.x*CELL+CELL/2,t.y*CELL+CELL/2,CELL*0.35,0,7);ctx.fill();ctx.fillStyle='#06210f';ctx.font='bold '+(CELL*0.4)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',t.x*CELL+CELL/2,t.y*CELL+CELL/2+1);}
for(let i=snake.length-1;i>=0;i--){const s=snake[i];const a=i===0?1:0.5+0.5*(1-i/snake.length);ctx.fillStyle=i===0?'#a8ffd0':'rgba(126,232,176,'+a+')';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4,4);else ctx.rect(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4);ctx.fill();}
$('lv').textContent=level;$('mv').textContent=moves;$('cl').textContent=collected+'/'+targets.length;$('coins').textContent=totalCoins;}
const pad=$('pad');[{},{l:'▲',d:[0,-1]},{},{l:'◀',d:[-1,0]},{l:'OK',ok:1},{l:'▶',d:[1,0]},{},{l:'▼',d:[0,1]},{}].forEach(it=>{const b=document.createElement('button');b.textContent=it.l||'';if(it.ok)b.className='ok';b.addEventListener('click',()=>{if(it.ok){if(!alive)init();}else if(it.d)move(it.d[0],it.d[1]);});pad.appendChild(b);});
document.addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key];if(m){e.preventDefault();move(m[0],m[1]);}});
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.hypot(dx,dy)<20)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);},{passive:true});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='input'){const m={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};if(m[d.act])move(m[d.act][0],m[d.act][1]);else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}}});
level=Number(localStorage.getItem('blocks_lv')||1);init();})();</script></body></html>
