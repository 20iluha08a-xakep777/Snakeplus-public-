<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake Blocks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding:6px;gap:6px}
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(200,220,255,.5);padding:2px 8px;flex-shrink:0}
.hdr b{color:#7ee8b0;font-size:12px;margin-left:3px}
.hdr .coins{font-size:11px;color:#ffd54a;font-weight:800}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{background:#050a14;border-radius:14px;box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 0 1.5px rgba(126,232,176,.25);display:block;touch-action:none}
.pieces-row{display:flex;gap:8px;justify-content:center;padding:4px 0;flex-shrink:0;min-height:80px}
.piece-slot{width:96px;height:76px;border-radius:10px;background:rgba(255,255,255,.03);border:1.5px solid rgba(126,232,176,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s}
.piece-slot.active{background:rgba(126,232,176,.12);border-color:#7ee8b0;box-shadow:0 0 0 2px rgba(126,232,176,.35)}
.piece-slot.empty{opacity:.4;cursor:default}
.piece-slot canvas{background:transparent;border:none;box-shadow:none;border-radius:0}
.combo{position:absolute;top:20%;left:50%;transform:translate(-50%,-50%) scale(.5);color:#ffd54a;font-size:32px;font-weight:900;letter-spacing:2px;opacity:0;pointer-events:none;text-shadow:0 0 20px #ffd54a;z-index:50;transition:all .4s}
.combo.show{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
.msg{position:fixed;inset:0;background:rgba(5,10,20,.94);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:100}
.msg.show{display:flex}
.msg h2{color:#7ee8b0;font-size:22px;letter-spacing:2px;text-transform:uppercase}
.msg p{font-size:13px;color:rgba(200,220,255,.8);line-height:1.7;max-width:300px}
.msg .row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg button{font:inherit;font-size:13px;font-weight:800;padding:12px 22px;border:2px solid #7ee8b0;border-radius:10px;background:linear-gradient(180deg,#8ff5bd,#48c98a);color:#06210f;cursor:pointer;letter-spacing:1px;text-transform:uppercase;min-width:110px}
.msg button.ghost{background:transparent;color:#7ee8b0}
.levels-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:320px;max-height:70vh;overflow-y:auto;padding:4px;margin-top:6px}
.lv-btn{aspect-ratio:1;border-radius:10px;border:1.5px solid rgba(126,232,176,.3);background:rgba(126,232,176,.05);color:#7ee8b0;font:inherit;font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation}
.lv-btn.done{background:linear-gradient(180deg,rgba(126,232,176,.3),rgba(72,201,138,.15));border-color:#7ee8b0}
.lv-btn.locked{opacity:.35;cursor:default}
.lv-btn.current{border-color:#ffd54a;box-shadow:0 0 0 2px rgba(255,213,74,.3)}
.lv-btn .check{position:absolute;top:2px;right:4px;font-size:11px;color:#7ee8b0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-150%);background:#7ee8b0;color:#06210f;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:800;z-index:200;transition:all .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span>Ур.<b id="lv">1</b> · Очки<b id="sc">0</b> · Цель<b id="goal">100</b></span>
    <span class="coins">💰 <span id="coins">0</span></span>
  </div>
  <div class="stage">
    <canvas id="c" width="380" height="380"></canvas>
    <div class="combo" id="combo"></div>
  </div>
  <div class="pieces-row" id="piecesRow"></div>
</div>
<div class="msg" id="msg"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const c=$('c'),ctx=c.getContext('2d');
const N=10;           // сетка
const CELL=c.width/N;
const GAP=1.5;

// Полиомино (все фигуры с координатами [x,y])
const SHAPES=[
  // Линии 1-5
  {name:'1',cells:[[0,0]],color:'#7ee8b0'},
  {name:'2v',cells:[[0,0],[0,1]],color:'#7ee8b0'},
  {name:'2h',cells:[[0,0],[1,0]],color:'#7ee8b0'},
  {name:'3v',cells:[[0,0],[0,1],[0,2]],color:'#48c98a'},
  {name:'3h',cells:[[0,0],[1,0],[2,0]],color:'#48c98a'},
  {name:'4v',cells:[[0,0],[0,1],[0,2],[0,3]],color:'#2eaa74'},
  {name:'4h',cells:[[0,0],[1,0],[2,0],[3,0]],color:'#2eaa74'},
  {name:'5v',cells:[[0,0],[0,1],[0,2],[0,3],[0,4]],color:'#1d8a5c'},
  {name:'5h',cells:[[0,0],[1,0],[2,0],[3,0],[4,0]],color:'#1d8a5c'},
  // Квадраты
  {name:'2x2',cells:[[0,0],[1,0],[0,1],[1,1]],color:'#66d9ff'},
  {name:'3x3',cells:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]],color:'#3a7ee8'},
  // L/J — 2 ориентации
  {name:'L1',cells:[[0,0],[0,1],[0,2],[1,2]],color:'#ffd54a'},
  {name:'L2',cells:[[0,0],[1,0],[0,1],[0,2]],color:'#ffd54a'},
  {name:'L3',cells:[[0,0],[1,0],[1,1],[1,2]],color:'#ffd54a'},
  {name:'L4',cells:[[0,0],[0,1],[0,2],[-1,2]],color:'#ffd54a'},
  {name:'J1',cells:[[1,0],[1,1],[1,2],[0,2]],color:'#ffb300'},
  {name:'J2',cells:[[0,0],[1,0],[2,0],[0,1]],color:'#ffb300'},
  {name:'J3',cells:[[0,0],[1,0],[0,1],[0,2]],color:'#ffb300'},
  {name:'J4',cells:[[0,0],[1,0],[2,0],[2,1]],color:'#ffb300'},
  // T
  {name:'T1',cells:[[0,0],[1,0],[2,0],[1,1]],color:'#b07ee8'},
  {name:'T2',cells:[[0,0],[0,1],[0,2],[1,1]],color:'#b07ee8'},
  {name:'T3',cells:[[1,0],[0,1],[1,1],[2,1]],color:'#b07ee8'},
  {name:'T4',cells:[[1,0],[0,1],[1,1],[1,2]],color:'#b07ee8'},
  // S/Z
  {name:'S1',cells:[[1,0],[2,0],[0,1],[1,1]],color:'#ff8a65'},
  {name:'S2',cells:[[0,0],[0,1],[1,1],[1,2]],color:'#ff8a65'},
  {name:'Z1',cells:[[0,0],[1,0],[1,1],[2,1]],color:'#ff5757'},
  {name:'Z2',cells:[[1,0],[0,1],[1,1],[0,2]],color:'#ff5757'},
  // Прямоугольники 2×3, 3×2
  {name:'2x3',cells:[[0,0],[1,0],[0,1],[1,1],[0,2],[1,2]],color:'#ff8a95'},
  {name:'3x2',cells:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],color:'#ff8a95'}
];
// Веса — 1 и 2 клетки редко, крупные чаще
const WEIGHTS=[2,5,5,5,5,4,4,3,3,4,2,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,3,3];

let grid=[],score=0,level=1,alive=true;
let pieces=[],activeIdx=0;
let totalCoins=Number(localStorage.getItem('sb_coins')||0);
let maxLevel=Number(localStorage.getItem('sb_maxlv')||1);
let doneLevels=(()=>{try{return JSON.parse(localStorage.getItem('sb_done')||'[]');}catch(e){return[];}})();
let comboStreak=0;

function lvGoal(){return 80+(level-1)*60;}

function save(){
  localStorage.setItem('sb_coins',totalCoins);
  localStorage.setItem('sb_maxlv',maxLevel);
  localStorage.setItem('sb_done',JSON.stringify(doneLevels));
  localStorage.setItem('sb_lv',level);
}
function postCoins(n){try{window.parent.postMessage({type:'addCoins',amount:n},'*');}catch(e){}}

// Инициализация
function init(){
  grid=Array.from({length:N},()=>Array(N).fill(null));
  score=0;alive=true;comboStreak=0;
  newTrio();
  render();
}
function newTrio(){
  pieces=[];
  for(let i=0;i<3;i++){
    const shape=weightedPick();
    pieces.push({shape,i:Math.floor(Math.random()*10000)});
  }
  activeIdx=0;
  // Проверка — можно ли вообще поставить хоть одну
  if(!anyCanPlace()){gameOver();}
  renderPieces();
}
function weightedPick(){
  const total=WEIGHTS.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<WEIGHTS.length;i++){r-=WEIGHTS[i];if(r<=0)return SHAPES[i];}
  return SHAPES[0];
}

function anyCanPlace(){
  for(const p of pieces){
    if(p.used)continue;
    if(findPlacement(p.shape.cells)!=null)return true;
  }
  return false;
}

function findPlacement(cells){
  const maxX=Math.max(...cells.map(c=>c[0]));
  const maxY=Math.max(...cells.map(c=>c[1]));
  const minX=Math.min(...cells.map(c=>c[0]));
  const minY=Math.min(...cells.map(c=>c[1]));
  for(let y=-minY;y<N-maxY;y++){
    for(let x=-minX;x<N-maxX;x++){
      let ok=true;
      for(const [cx,cy] of cells){
        const nx=x+cx,ny=y+cy;
        if(nx<0||ny<0||nx>=N||ny>=N){ok=false;break;}
        if(grid[ny][nx]){ok=false;break;}
      }
      if(ok)return {x,y};
    }
  }
  return null;
}

// Рендер доски
function render(){
  ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
  // Сетка
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const px=x*CELL,py=y*CELL;
    ctx.fillStyle='rgba(255,255,255,.04)';
    ctx.fillRect(px+GAP,py+GAP,CELL-GAP*2,CELL-GAP*2);
    if(grid[y][x]){
      ctx.fillStyle=grid[y][x];
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(px+GAP+1,py+GAP+1,CELL-GAP*2-2,CELL-GAP*2-2,4);
      else ctx.rect(px+GAP+1,py+GAP+1,CELL-GAP*2-2,CELL-GAP*2-2);
      ctx.fill();
      // Подсветка
      ctx.fillStyle='rgba(255,255,255,.15)';
      ctx.fillRect(px+GAP+2,py+GAP+2,CELL-GAP*2-4,3);
    }
  }
  // Призрак фигуры под пальцем
  if(dragPreview){
    const {cells,color,originX,originY}=dragPreview;
    for(const [cx,cy] of cells){
      const x=dragPreview.tx+cx,y=dragPreview.ty+cy;
      if(x<0||y<0||x>=N||y>=N)continue;
      const px=x*CELL,py=y*CELL;
      ctx.fillStyle=color;
      ctx.globalAlpha=0.5;
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(px+GAP+1,py+GAP+1,CELL-GAP*2-2,CELL-GAP*2-2,4);
      else ctx.rect(px+GAP+1,py+GAP+1,CELL-GAP*2-2,CELL-GAP*2-2);
      ctx.fill();
      ctx.globalAlpha=1;
    }
    // Красная подсветка если нельзя
    if(!canPlaceAt(dragPreview.cells,dragPreview.tx,dragPreview.ty)){
      for(const [cx,cy] of cells){
        const x=dragPreview.tx+cx,y=dragPreview.ty+cy;
        if(x<0||y<0||x>=N||y>=N)continue;
        const px=x*CELL,py=y*CELL;
        ctx.strokeStyle='#ff5757';ctx.lineWidth=2;
        ctx.strokeRect(px+GAP+1,py+GAP+1,CELL-GAP*2-2,CELL-GAP*2-2);
      }
    }
  }
  $('sc').textContent=score;
  $('lv').textContent=level;
  $('goal').textContent=lvGoal();
  $('coins').textContent=totalCoins;
}

// Рендер 3 фигур
function renderPieces(){
  const row=$('piecesRow');
  row.innerHTML='';
  pieces.forEach((p,i)=>{
    const slot=document.createElement('div');
    slot.className='piece-slot';
    if(i===activeIdx&&!p.used)slot.classList.add('active');
    if(p.used)slot.classList.add('empty');
    const pc=document.createElement('canvas');
    pc.width=90;pc.height=70;
    const pctx=pc.getContext('2d');
    const cells=p.shape.cells;
    const maxX=Math.max(...cells.map(c=>c[0]));
    const maxY=Math.max(...cells.map(c=>c[1]));
    const minX=Math.min(...cells.map(c=>c[0]));
    const minY=Math.min(...cells.map(c=>c[1]));
    const w=maxX-minX+1,h=maxY-minY+1;
    const cellSize=Math.min(60/w,50/h,14);
    const offsetX=(90-w*cellSize)/2;
    const offsetY=(70-h*cellSize)/2;
    for(const [cx,cy] of cells){
      const px=offsetX+(cx-minX)*cellSize;
      const py=offsetY+(cy-minY)*cellSize;
      pctx.fillStyle=p.shape.color;
      if(pctx.roundRect){pctx.beginPath();pctx.roundRect(px+1,py+1,cellSize-2,cellSize-2,3);pctx.fill();}
      else pctx.fillRect(px+1,py+1,cellSize-2,cellSize-2);
      pctx.fillStyle='rgba(255,255,255,.15)';
      pctx.fillRect(px+2,py+2,cellSize-4,2);
    }
    slot.appendChild(pc);
    slot.addEventListener('click',()=>{
      if(p.used)return;
      activeIdx=i;
      renderPieces();
    });
    row.appendChild(slot);
  });
}

// Drag & drop
let dragPreview=null;
let dragStartX=0,dragStartY=0,isDragging=false;
let pointerOffset=null;

function canPlaceAt(cells,tx,ty){
  for(const [cx,cy] of cells){
    const x=tx+cx,y=ty+cy;
    if(x<0||y<0||x>=N||y>=N)return false;
    if(grid[y][x])return false;
  }
  return true;
}

function pixelToGrid(px,py){
  return {x:Math.floor(px/CELL),y:Math.floor(py/CELL)};
}

// Touch на доске (перетаскивание фигуры)
c.addEventListener('pointerdown',e=>{
  if(!alive)return;
  const rect=c.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(c.width/rect.width);
  const py=(e.clientY-rect.top)*(c.height/rect.height);
  const piece=pieces[activeIdx];
  if(!piece||piece.used)return;
  const {x,y}=pixelToGrid(px,py);
  // Запоминаем точку нажатия как "центр фигуры"
  const cells=piece.shape.cells;
  const cx=Math.floor((Math.min(...cells.map(k=>k[0]))+Math.max(...cells.map(k=>k[0])))/2);
  const cy=Math.floor((Math.min(...cells.map(k=>k[1]))+Math.max(...cells.map(k=>k[1])))/2);
  pointerOffset={x:cx,y:cy};
  dragPreview={
    cells,color:piece.shape.color,
    tx:x-cx,ty:y-cy,
    originX:x,originY:y
  };
  isDragging=true;
  render();
  try{c.setPointerCapture(e.pointerId);}catch(err){}
});

c.addEventListener('pointermove',e=>{
  if(!isDragging||!dragPreview)return;
  const rect=c.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(c.width/rect.width);
  const py=(e.clientY-rect.top)*(c.height/rect.height);
  const {x,y}=pixelToGrid(px,py);
  dragPreview.tx=x-pointerOffset.x;
  dragPreview.ty=y-pointerOffset.y;
  render();
});

c.addEventListener('pointerup',e=>{
  if(!isDragging||!dragPreview){isDragging=false;dragPreview=null;return;}
  const cells=dragPreview.cells;
  const tx=dragPreview.tx,ty=dragPreview.ty;
  if(canPlaceAt(cells,tx,ty)){
    placePiece(cells,tx,ty,dragPreview.color);
  }
  dragPreview=null;
  isDragging=false;
  render();
});

function placePiece(cells,tx,ty,color){
  for(const [cx,cy] of cells){
    grid[ty+cy][tx+cx]=color;
  }
  score+=1;
  pieces[activeIdx].used=true;
  // Ищем следующую неиспользованную
  const nextFree=pieces.findIndex(p=>!p.used);
  if(nextFree>=0)activeIdx=nextFree;
  // Проверяем линии
  const cleared=clearLines();
  if(cleared>0){
    comboStreak++;
    const base=10*cleared*cleared;
    const bonus=comboStreak>1?base*comboStreak:base;
    score+=bonus;
    showCombo(cleared,comboStreak,bonus);
    playBeep(600+cleared*100);
  }else{
    comboStreak=0;
  }
  // Все использованы → новая тройка
  if(pieces.every(p=>p.used)){
    newTrio();
  }
  renderPieces();
  checkWin();
  if(!anyCanPlace())gameOver();
  render();
}

function clearLines(){
  const toClear=new Set();
  // Горизонтали
  for(let y=0;y<N;y++){
    if(grid[y].every(v=>v)){for(let x=0;x<N;x++)toClear.add(x+','+y);}
  }
  // Вертикали
  for(let x=0;x<N;x++){
    let ok=true;
    for(let y=0;y<N;y++)if(!grid[y][x]){ok=false;break;}
    if(ok){for(let y=0;y<N;y++)toClear.add(x+','+y);}
  }
  toClear.forEach(k=>{
    const [x,y]=k.split(',').map(Number);
    grid[y][x]=null;
  });
  // Считаем количество линий (гориз + верт)
  let count=0;
  for(let y=0;y<N;y++)if(grid[y].every(v=>!v)){} // неверно
  // Правильнее: считаем сколько линий было полных ДО очистки
  // Но toClear содержит все клетки — можно посчитать сколько полных линий было
  return toClear.size/(N) | 0 || countLinesRemoved();
}
function countLinesRemoved(){return 0;}

function showCombo(lines,streak,points){
  const el=$('combo');
  el.textContent=(lines>1?'+' + lines + ' линий! ':'')+'+'+points;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),900);
  if(streak>1){
    setTimeout(()=>{
      el.textContent='КОМБО ×'+streak;
      el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'),700);
    },950);
  }
}

function checkWin(){
  if(score>=lvGoal()){
    if(doneLevels.indexOf(level)===-1)doneLevels.push(level);
    const reward=50+level*25;
    totalCoins+=reward;
    postCoins(reward);
    if(level+1>maxLevel)maxLevel=level+1;
    save();
    showModal('🎉 Уровень пройден!',
      '+'+reward+' 💰<br>Очки: '+score+'/'+lvGoal()+'<br>Открыт '+maxLevel+'-й уровень',
      [{label:'Следующий',cls:'primary',fn:()=>{level++;save();closeModal();init();}},
       {label:'Уровни',cls:'ghost',fn:()=>{closeModal();showLevels();}}]);
  }
}

function gameOver(){
  alive=false;
  showModal('🧱 Больше некуда!',
    'Очки: '+score+'<br>Уровень: '+level,
    [{label:'Заново',cls:'primary',fn:()=>{closeModal();init();}},
     {label:'Уровни',cls:'ghost',fn:()=>{closeModal();showLevels();}}]);
}

// Модалка
function showModal(title,body,actions){
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent=title;m.appendChild(h);
  const p=document.createElement('p');p.innerHTML=body;m.appendChild(p);
  const row=document.createElement('div');row.className='row-btns';
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.textContent=a.label;b.className=a.cls||'';
    b.onclick=a.fn;
    row.appendChild(b);
  });
  m.appendChild(row);
  m.classList.add('show');
}
function closeModal(){$('msg').classList.remove('show');}

function showLevels(){
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent='🗺 Уровни';m.appendChild(h);
  const grid2=document.createElement('div');grid2.className='levels-grid';
  for(let i=1;i<=20;i++){
    const done=doneLevels.indexOf(i)!==-1;
    const locked=i>maxLevel;
    const cur=i===level;
    const el=document.createElement('div');
    el.className='lv-btn'+(done?' done':'')+(locked?' locked':'')+(cur?' current':'');
    el.textContent=(done?'':'')+i;
    if(done)el.innerHTML='<span class="check">✓</span>'+i;
    if(!locked)el.onclick=()=>{level=i;save();closeModal();init();};
    grid2.appendChild(el);
  }
  m.appendChild(grid2);
  const row=document.createElement('div');row.className='row-btns';
  const btn=document.createElement('button');
  btn.textContent='Закрыть';btn.className='ghost';
  btn.onclick=closeModal;
  row.appendChild(btn);
  m.appendChild(row);
  m.classList.add('show');
}

// Звук
let audioCtx=null;
function playBeep(freq){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';o.frequency.value=freq;
    g.gain.setValueAtTime(0.1,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.2);
  }catch(e){}
}

function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

// Кнопки Snake+
window.addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='input'){
    if(d.act==='ok'||d.act==='a'){
      // Авто-размещение текущей фигуры в первой доступной точке
      const p=pieces[activeIdx];
      if(p&&!p.used){
        const spot=findPlacement(p.shape.cells);
        if(spot)placePiece(p.shape.cells,spot.x,spot.y,p.shape.color);
      }
    }
    else if(d.act==='left'||d.act==='right'){
      const dir=d.act==='left'?-1:1;
      let i=activeIdx;
      for(let k=0;k<3;k++){
        i=(i+dir+3)%3;
        if(!pieces[i].used){activeIdx=i;renderPieces();break;}
      }
    }
    else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}
  }
});

// Фикс бага clearLines — переопределяю корректно
const _origClear=clearLines;
clearLines=function(){
  const rowsToClear=[];
  const colsToClear=[];
  for(let y=0;y<N;y++){
    if(grid[y].every(v=>v))rowsToClear.push(y);
  }
  for(let x=0;x<N;x++){
    let ok=true;
    for(let y=0;y<N;y++)if(!grid[y][x]){ok=false;break;}
    if(ok)colsToClear.push(x);
  }
  for(const y of rowsToClear)for(let x=0;x<N;x++)grid[y][x]=null;
  for(const x of colsToClear)for(let y=0;y<N;y++)grid[y][x]=null;
  return rowsToClear.length+colsToClear.length;
};

level=Number(localStorage.getItem('sb_lv')||1);
init();
})();
