<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake Bomber</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding:6px;gap:5px}
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(200,220,255,.5);padding:2px 8px;flex-shrink:0}
.hdr b{color:#7ee8b0;font-size:12px;margin-left:3px}
.hdr .coins{font-size:11px;color:#ffd54a;font-weight:800}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{background:#050a14;border-radius:14px;box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 0 1.5px rgba(126,232,176,.25);display:block;touch-action:none;max-width:100%;max-height:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;max-width:190px;width:62vw;margin:0 auto;flex-shrink:0}
.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:10px;color:#cfe0ff;font-size:20px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer;touch-action:none;transition:transform .08s;user-select:none;display:flex;align-items:center;justify-content:center}
.pad button:active,.pad button.pressed{color:#7ee8b0;border-color:#7ee8b0;transform:scale(.94)}
.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a);font-size:14px}
.pad .bomb{color:#ff5757;border-color:#ff5757;background:linear-gradient(180deg,rgba(255,87,87,.15),rgba(255,87,87,.05));font-size:22px}
.pad .bomb:active,.pad .bomb.pressed{background:#ff5757;color:#06210f}
.msg{position:fixed;inset:0;background:rgba(5,10,20,.94);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:100}
.msg.show{display:flex}
.msg h2{color:#7ee8b0;font-size:22px;letter-spacing:2px;text-transform:uppercase}
.msg p{font-size:13px;color:rgba(200,220,255,.8);line-height:1.7;max-width:300px}
.msg .row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg button{font:inherit;font-size:13px;font-weight:800;padding:12px 22px;border:2px solid #7ee8b0;border-radius:10px;background:linear-gradient(180deg,#8ff5bd,#48c98a);color:#06210f;cursor:pointer;letter-spacing:1px;text-transform:uppercase;min-width:110px}
.msg button.ghost{background:transparent;color:#7ee8b0}
.levels-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:320px;max-height:70vh;overflow-y:auto;padding:4px;margin-top:6px}
.lv-btn{aspect-ratio:1;border-radius:10px;border:1.5px solid rgba(126,232,176,.3);background:rgba(126,232,176,.05);color:#7ee8b0;font:inherit;font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation}
.lv-btn.done{background:linear-gradient(180deg,rgba(126,232,176,.3),rgba(72,201,138,.15));border-color:#7ee8b0}
.lv-btn.locked{opacity:.35;cursor:default}
.lv-btn.current{border-color:#ffd54a;box-shadow:0 0 0 2px rgba(255,213,74,.3)}
.lv-btn .check{position:absolute;top:2px;right:4px;font-size:11px;color:#7ee8b0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-150%);background:#7ee8b0;color:#06210f;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:800;z-index:200;transition:all .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span>Ур.<b id="lv">1</b> · Врагов<b id="en">0</b> · 💣<b id="bm">1</b></span>
    <span class="coins">💰 <span id="coins">0</span></span>
  </div>
  <div class="stage"><canvas id="c" width="380" height="380"></canvas></div>
  <div class="pad" id="pad"></div>
</div>
<div class="msg" id="msg"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const c=$('c'),ctx=c.getContext('2d');
const S=13;             // размер карты
const CELL=c.width/S;

let player,enemies,bombs,blast,blocks,powerups;
let level=1,alive=true,gameActive=true;
let maxBombs=1,bombPower=2,pendingBombs=0;
let totalCoins=Number(localStorage.getItem('sbmb_coins')||0);
let maxLevel=Number(localStorage.getItem('sbmb_maxlv')||1);
let doneLevels=(()=>{try{return JSON.parse(localStorage.getItem('sbmb_done')||'[]');}catch(e){return[];}})();
let shieldUntil=0;

function save(){
  localStorage.setItem('sbmb_coins',totalCoins);
  localStorage.setItem('sbmb_maxlv',maxLevel);
  localStorage.setItem('sbmb_done',JSON.stringify(doneLevels));
  localStorage.setItem('sbmb_lv',level);
}
function postCoins(n){try{window.parent.postMessage({type:'addCoins',amount:n},'*');}catch(e){}}

// ============ ГЕНЕРАЦИЯ УРОВНЯ С ПРОВЕРКОЙ ДОСТИЖИМОСТИ ============
function generateLevel(){
  for(let attempt=0;attempt<200;attempt++){
    const result=tryGenerate();
    if(result)return result;
  }
  return fallbackGenerate();
}

function tryGenerate(){
  const size=S;
  const map=Array.from({length:size},()=>Array(size).fill('.')); // '.' пусто, '#' твёрдая, 'X' разрушаемая
  // Рамка
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    if(x===0||y===0||x===size-1||y===size-1)map[y][x]='#';
  }
  // Твёрдые стены в клетках (чёт-чёт)
  for(let y=2;y<size-1;y+=2){
    for(let x=2;x<size-1;x+=2){
      map[y][x]='#';
    }
  }
  // Спавн игрока
  const startX=1,startY=1;
  map[startY][startX]='P';

  // Рандомно: разрушаемые блоки вокруг стен
  for(let y=1;y<size-1;y++)for(let x=1;x<size-1;x++){
    if(map[y][x]!=='.')continue;
    // Клетки, которые рядом с твёрдой стеной (по горизонтали/вертикали) с шансом 70% становятся разрушаемыми
    let nearWall=false;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size)continue;
      if(map[ny][nx]==='#'){nearWall=true;break;}
    }
    if(nearWall&&Math.random()<0.75)map[y][x]='X';
    else if(Math.random()<0.1)map[y][x]='X';
  }

  // BFS проверка достижимости всех клеток кроме твёрдых стен
  const reachable=bfsReachable(map,size,startX,startY);
  let totalFree=0;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    if(map[y][x]==='.')totalFree++;
  }
  if(reachable<totalFree*0.95)return null; // не все клетки достижимы

  // Собираем свободные клетки для врагов
  const freeCells=[];
  for(let y=1;y<size-1;y++)for(let x=1;x<size-1;x++){
    if(map[y][x]==='.'&&(Math.abs(x-startX)+Math.abs(y-startY))>6){
      freeCells.push({x,y});
    }
  }
  if(freeCells.length<8)return null;

  // Расставляем врагов
  const enemyCount=2+Math.min(level,4);
  const enemies=[];
  for(let i=0;i<enemyCount;i++){
    if(freeCells.length===0)break;
    const idx=Math.floor(Math.random()*freeCells.length);
    enemies.push({x:freeCells[idx].x,y:freeCells[idx].y,alive:true,dir:{x:0,y:0},timer:0,moving:0});
    freeCells.splice(idx,1);
  }

  // Бонусы на карте (иногда)
  const powerups=[];
  if(level>=2&&Math.random()<0.6&&freeCells.length>0){
    const idx=Math.floor(Math.random()*freeCells.length);
    powerups.push({x:freeCells[idx].x,y:freeCells[idx].y,type:'bomb'});
  }
  if(level>=3&&Math.random()<0.5&&freeCells.length>1){
    const idx=Math.floor(Math.random()*freeCells.length);
    powerups.push({x:freeCells[idx].x,y:freeCells[idx].y,type:'power'});
  }

  return {map,enemies,powerups};
}

function bfsReachable(map,size,sx,sy){
  const visited=Array.from({length:size},()=>Array(size).fill(false));
  const q=[[sx,sy]];
  visited[sy][sx]=true;
  let count=0;
  while(q.length){
    const [x,y]=q.shift();
    count++;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size)continue;
      if(visited[ny][nx])continue;
      if(map[ny][nx]==='#'||map[ny][nx]==='X')continue;
      visited[ny][nx]=true;
      q.push([nx,ny]);
    }
  }
  return count;
}

function fallbackGenerate(){
  // Пустое поле с 5 врагами — на всякий
  const map=Array.from({length:S},()=>Array(S).fill('.'));
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    if(x===0||y===0||x===S-1||y===S-1)map[y][x]='#';
  }
  map[1][1]='P';
  return {map,enemies:[{x:S-2,y:S-2,alive:true,dir:{x:0,y:0},timer:0,moving:0}],powerups:[]};
}

// ============ ИГРА ============
function init(){
  const gen=generateLevel();
  blocks=gen.map;
  player={x:1,y:1};
  enemies=gen.enemies;
  powerups=gen.powerups||[];
  bombs=[];blast=[];alive=true;gameActive=true;
  maxBombs=1+Math.floor((level-1)/3);
  bombPower=2+Math.floor((level-1)/4);
  pendingBombs=0;shieldUntil=0;
  render();
  updateHud();
}

function updateHud(){
  $('lv').textContent=level;
  $('en').textContent=enemies.filter(e=>e.alive).length;
  $('bm').textContent=maxBombs;
  $('coins').textContent=totalCoins;
}

// ============ ДВИЖЕНИЕ ============
function move(dx,dy){
  if(!alive||!gameActive)return;
  const nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=S||ny>=S)return;
  const cell=blocks[ny][nx];
  if(cell==='#'||cell==='X')return;
  if(bombs.some(b=>b.x===nx&&b.y===ny))return;
  player={x:nx,y:ny};
  // Подбор бонуса
  const idx=powerups.findIndex(p=>p.x===nx&&p.y===ny);
  if(idx>=0){
    const p=powerups[idx];
    powerups.splice(idx,1);
    if(p.type==='bomb'){maxBombs++;showToast('💣 +1 бомба');}
    else if(p.type==='power'){bombPower++;showToast('💥 +1 мощность');}
    updateHud();
  }
  render();
}

function placeBomb(){
  if(!alive||!gameActive)return;
  if(bombs.filter(b=>b.owner==='p').length>=maxBombs)return;
  if(bombs.some(b=>b.x===player.x&&b.y===player.y))return;
  bombs.push({x:player.x,y:player.y,timer:2200,owner:'p',power:bombPower});
  playBeep(180);
  render();
}

function explode(b){
  const cells=[];
  cells.push({x:b.x,y:b.y});
  // 4 направления
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    for(let i=1;i<=b.power;i++){
      const x=b.x+dx*i,y=b.y+dy*i;
      if(x<0||y<0||x>=S||y>=S)break;
      const cell=blocks[y][x];
      if(cell==='#')break; // твёрдая стена — стоп
      cells.push({x,y});
      if(cell==='X'){blocks[y][x]='.';break;} // разрушаемая — стоп
    }
  }
  for(const cell of cells){
    blast.push({x:cell.x,y:cell.y,end:performance.now()+400});
    // Взрыв на игрока
    if(cell.x===player.x&&cell.y===player.y&&performance.now()>shieldUntil){
      alive=false;gameActive=false;
      setTimeout(()=>onDeath(),100);
      return;
    }
    // На врагов
    for(const e of enemies){
      if(e.alive&&e.x===cell.x&&e.y===cell.y)e.alive=false;
    }
    // Бонусы в зоне взрыва
    for(let i=powerups.length-1;i>=0;i--){
      if(powerups[i].x===cell.x&&powerups[i].y===cell.y)powerups.splice(i,1);
    }
    // Цепные бомбы
    for(let i=bombs.length-1;i>=0;i--){
      const ob=bombs[i];
      if(ob!==b&&ob.x===cell.x&&ob.y===cell.y){
        ob.timer=Math.min(ob.timer,200);
      }
    }
  }
}

// ============ ИИ ВРАГОВ ============
function moveEnemies(dt){
  for(const e of enemies){
    if(!e.alive)continue;
    e.timer-=dt;
    e.moving=Math.max(0,e.moving-dt);
    if(e.timer>0)continue;
    e.timer=700+Math.random()*300;

    // Собираем возможные направления
    const dirs=[];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=e.x+dx,ny=e.y+dy;
      if(nx<1||ny<1||nx>=S-1||ny>=S-1)continue;
      const cell=blocks[ny][nx];
      if(cell==='#'||cell==='X')continue;
      if(bombs.some(b=>b.x===nx&&b.y===ny))continue;
      // Проверка что не в зоне взрыва
      const inBlast=blast.some(bl=>bl.x===nx&&bl.y===ny);
      if(inBlast)continue;
      dirs.push({dx,dy,x:nx,y:ny});
    }
    if(!dirs.length)continue;

    let pick=null;
    // Продолжаем движение если возможно
    const cont=dirs.find(d=>d.dx===e.dir.x&&d.dy===e.dir.y);
    if(cont&&Math.random()<0.7){pick=cont;}
    else{
      // Избегаем игрока если близко, иначе идём к игроку
      const dist=Math.abs(e.x-player.x)+Math.abs(e.y-player.y);
      if(dist<=4&&Math.random()<0.3){
        // Убегаем
        let best=null;
        for(const d of dirs){
          const nd=Math.abs(d.x-player.x)+Math.abs(d.y-player.y);
          if(!best||nd>best.score){best={d,score:nd};}
        }
        if(best)pick=best.d;
      } else {
        // Идём к игроку (или случайно)
        if(Math.random()<0.5){
          let best=null;
          for(const d of dirs){
            const nd=Math.abs(d.x-player.x)+Math.abs(d.y-player.y);
            if(!best||nd<best.score){best={d,score:nd};}
          }
          if(best)pick=best.d;
        } else {
          pick=dirs[Math.floor(Math.random()*dirs.length)];
        }
      }
    }
    if(pick){
      e.dir={x:pick.dx,y:pick.dy};
      e.x=pick.x;e.y=pick.y;
      e.moving=200;
    }
  }
}

// ============ ЦИКЛ ============
let lastT=0;
function loop(t){
  const dt=Math.min(t-lastT,60);lastT=t;
  if(gameActive){
    // Бомбы
    const now=performance.now();
    for(let i=bombs.length-1;i>=0;i--){
      const b=bombs[i];
      b.timer-=dt;
      if(b.timer<=0){
        explode(b);
        bombs.splice(i,1);
      }
    }
    // Убираем старые взрывы
    blast=blast.filter(b=>b.end>now);

    moveEnemies(dt);

    // Проверка столкновения с врагом
    if(alive){
      for(const e of enemies){
        if(e.alive&&e.x===player.x&&e.y===player.y&&performance.now()>shieldUntil){
          alive=false;gameActive=false;
          setTimeout(()=>onDeath(),100);
          break;
        }
      }
    }

    // Проверка победы
    if(alive&&enemies.every(e=>!e.alive)){
      gameActive=false;
      setTimeout(()=>onWin(),100);
    }
  }
  render();
  requestAnimationFrame(loop);
}

function onWin(){
  if(doneLevels.indexOf(level)===-1)doneLevels.push(level);
  const reward=40+level*20;
  totalCoins+=reward;
  postCoins(reward);
  if(level+1>maxLevel)maxLevel=level+1;
  save();
  showModal('🎉 Уровень пройден!',
    '+'+reward+' 💰<br>Уровень '+level+' — открыт '+maxLevel+'-й',
    [{label:'Следующий',cls:'primary',fn:()=>{level++;save();closeModal();init();}},
     {label:'Уровни',cls:'ghost',fn:()=>{closeModal();showLevels();}}]);
  playBeep(800);
}

function onDeath(){
  showModal('💀 Ты взорвался!',
    'Уровень '+level,
    [{label:'Заново',cls:'primary',fn:()=>{closeModal();init();}},
     {label:'Уровни',cls:'ghost',fn:()=>{closeModal();showLevels();}}]);
  playBeep(150);
}

// ============ РЕНДЕР ============
function render(){
  ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
  const now=performance.now();

  // Клетки
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const px=x*CELL,py=y*CELL;
    const cell=blocks[y][x];
    if(cell==='#'){
      ctx.fillStyle='#22304d';
      ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
      ctx.fillStyle='#3a4a6d';
      ctx.fillRect(px+3,py+3,CELL-6,CELL-6);
      ctx.fillStyle='#4a5a7d';
      ctx.fillRect(px+5,py+5,CELL-10,3);
    } else if(cell==='X'){
      ctx.fillStyle='#5a4a2a';
      ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
      ctx.fillStyle='#8a6a3a';
      ctx.fillRect(px+3,py+3,CELL-6,CELL-6);
      ctx.strokeStyle='#6a4a1a';ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(px+4,py+CELL/2);ctx.lineTo(px+CELL-4,py+CELL/2);
      ctx.moveTo(px+CELL/2,py+4);ctx.lineTo(px+CELL/2,py+CELL-4);
      ctx.stroke();
    } else if((x+y)%2===0){
      ctx.fillStyle='rgba(255,255,255,.02)';
      ctx.fillRect(px,py,CELL,CELL);
    }
  }

  // Взрывы
  for(const bl of blast){
    const t=(bl.end-now)/400;
    ctx.fillStyle='rgba(255,180,50,'+(0.4+t*0.5)+')';
    ctx.beginPath();
    ctx.arc(bl.x*CELL+CELL/2,bl.y*CELL+CELL/2,CELL*0.45*(0.6+t*0.4),0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,200,'+t*0.7+')';
    ctx.beginPath();
    ctx.arc(bl.x*CELL+CELL/2,bl.y*CELL+CELL/2,CELL*0.25,0,Math.PI*2);
    ctx.fill();
  }

  // Бонусы
  for(const p of powerups){
    const px=p.x*CELL+CELL/2,py=p.y*CELL+CELL/2;
    const pulse=0.8+0.2*Math.sin(now/200);
    ctx.fillStyle=p.type==='bomb'?'rgba(255,87,87,.3)':'rgba(255,213,74,.3)';
    ctx.beginPath();ctx.arc(px,py,CELL*0.4*pulse,0,Math.PI*2);ctx.fill();
    ctx.font=(CELL*0.7)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.type==='bomb'?'💣':'💥',px,py+1);
  }

  // Бомбы
  for(const b of bombs){
    const px=b.x*CELL+CELL/2,py=b.y*CELL+CELL/2;
    const flash=Math.floor((2200-b.timer)/200)%2===0;
    ctx.fillStyle=flash?'#ff5757':'#1a1a1a';
    ctx.beginPath();ctx.arc(px,py,CELL*0.35,0,Math.PI*2);ctx.fill();
    if(flash){
      ctx.fillStyle='#ffd54a';
      ctx.beginPath();ctx.arc(px+CELL*0.2,py-CELL*0.2,CELL*0.08,0,Math.PI*2);ctx.fill();
    }
  }

  // Враги
  for(const e of enemies){
    if(!e.alive)continue;
    const px=e.x*CELL+CELL/2,py=e.y*CELL+CELL/2;
    ctx.fillStyle='#ff8a65';
    ctx.beginPath();ctx.arc(px,py,CELL*0.36,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(px-CELL*0.12,py-CELL*0.05,CELL*0.07,0,Math.PI*2);
    ctx.arc(px+CELL*0.12,py-CELL*0.05,CELL*0.07,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(px-CELL*0.12,py-CELL*0.05,CELL*0.03,0,Math.PI*2);
    ctx.arc(px+CELL*0.12,py-CELL*0.05,CELL*0.03,0,Math.PI*2);
    ctx.fill();
  }

  // Игрок
  if(alive){
    const px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
    if(performance.now()<shieldUntil){
      ctx.strokeStyle='rgba(126,232,176,.7)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(px,py,CELL*0.5,0,Math.PI*2);ctx.stroke();
    }
    ctx.fillStyle='#7ee8b0';
    ctx.beginPath();ctx.arc(px,py,CELL*0.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#06210f';
    ctx.beginPath();
    ctx.arc(px-CELL*0.12,py-CELL*0.05,CELL*0.07,0,Math.PI*2);
    ctx.arc(px+CELL*0.12,py-CELL*0.05,CELL*0.07,0,Math.PI*2);
    ctx.fill();
  }
}

// ============ УПРАВЛЕНИЕ ============
const pad=$('pad');
const layout=[
  {},{act:'up',label:'▲'},{act:'bomb',label:'💣',cls:'bomb'},
  {act:'left',label:'◀'},{act:'ok',label:'OK',cls:'ok'},{act:'right',label:'▶'},
  {},{act:'down',label:'▼'},{}
];
layout.forEach(item=>{
  const b=document.createElement('button');
  if(!item.act){b.style.visibility='hidden';pad.appendChild(b);return;}
  b.textContent=item.label;
  if(item.cls)b.className=item.cls;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    b.classList.add('pressed');
    if(item.act==='up')move(0,-1);
    else if(item.act==='down')move(0,1);
    else if(item.act==='left')move(-1,0);
    else if(item.act==='right')move(1,0);
    else if(item.act==='bomb')placeBomb();
    else if(item.act==='ok'){/* OK — заглушка, можно тап по полю */ }
  });
  const up=()=>b.classList.remove('pressed');
  b.addEventListener('pointerup',up);
  b.addEventListener('pointerleave',up);
  b.addEventListener('pointercancel',up);
  pad.appendChild(b);
});

// Свайпы по полю
let tx=0,ty=0,swiped=false;
c.addEventListener('touchstart',e=>{
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;swiped=false;
},{passive:true});
c.addEventListener('touchmove',e=>{
  if(swiped)return;
  const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  if(Math.hypot(dx,dy)<30)return;
  swiped=true;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);
  else move(0,dy>0?1:-1);
},{passive:true});
c.addEventListener('touchend',()=>{if(!swiped)placeBomb();},{passive:true});

// Клавиатура
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='ц'){e.preventDefault();move(0,-1);}
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='ы'){e.preventDefault();move(0,1);}
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ф'){e.preventDefault();move(-1,0);}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='в'){e.preventDefault();move(1,0);}
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();placeBomb();}
  else if(e.key==='Escape')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}
});

// Сообщения от Snake+
window.addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='input'){
    if(d.act==='up')move(0,-1);
    else if(d.act==='down')move(0,1);
    else if(d.act==='left')move(-1,0);
    else if(d.act==='right')move(1,0);
    else if(d.act==='ok'||d.act==='a')placeBomb();
    else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}
  }
});

// ============ МОДАЛКИ ============
function showModal(title,body,actions){
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent=title;m.appendChild(h);
  const p=document.createElement('p');p.innerHTML=body;m.appendChild(p);
  const row=document.createElement('div');row.className='row-btns';
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.textContent=a.label;b.className=a.cls||'';
    b.onclick=a.fn;
    row.appendChild(b);
  });
  m.appendChild(row);
  m.classList.add('show');
}
function closeModal(){$('msg').classList.remove('show');}

function showLevels(){
  const m=$('msg');
  m.innerHTML='';
  const h=document.createElement('h2');h.textContent='🗺 Уровни';m.appendChild(h);
  const grid=document.createElement('div');grid.className='levels-grid';
  for(let i=1;i<=20;i++){
    const done=doneLevels.indexOf(i)!==-1;
    const locked=i>maxLevel;
    const cur=i===level;
    const el=document.createElement('div');
    el.className='lv-btn'+(done?' done':'')+(locked?' locked':'')+(cur?' current':'');
    el.textContent=(done?'':'')+i;
    if(done)el.innerHTML='<span class="check">✓</span>'+i;
    if(!locked)el.onclick=()=>{level=i;save();closeModal();init();};
    grid.appendChild(el);
  }
  m.appendChild(grid);
  const row=document.createElement('div');row.className='row-btns';
  const btn=document.createElement('button');
  btn.textContent='Закрыть';btn.className='ghost';btn.onclick=closeModal;
  row.appendChild(btn);
  m.appendChild(row);
  m.classList.add('show');
}

// ============ УТИЛИТЫ ============
let audioCtx=null;
function playBeep(freq){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.frequency.value=freq;
    g.gain.setValueAtTime(0.06,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);
    o.connect(g).connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.15);
  }catch(e){}
}
function showToast(msg){
  const t=$('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

// ============ СТАРТ ============
level=Number(localStorage.getItem('sbmb_lv')||1);
init();
requestAnimationFrame(loop);
})();
