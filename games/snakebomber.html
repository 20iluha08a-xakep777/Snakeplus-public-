<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake Bomber</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:#0d1526;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;padding:8px;gap:8px}.hud{display:flex;gap:14px;font-size:11px;letter-spacing:1px;color:rgba(200,220,255,.6);text-transform:uppercase}.hud b{color:#7ee8b0;font-size:13px;margin-left:4px}.wrap{position:relative;display:flex}.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.94);border-radius:10px;gap:12px;padding:20px;text-align:center;z-index:10}.msg.show{display:flex}.msg h2{color:#7ee8b0;font-size:20px}.msg p{font-size:12px;color:rgba(200,220,255,.75);line-height:1.6}.msg button{font:inherit;font-size:13px;font-weight:700;padding:10px 22px;border:2px solid #7ee8b0;border-radius:8px;background:#7ee8b0;color:#06210f;cursor:pointer}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:240px;width:70vw}.pad button{aspect-ratio:1;font:inherit;border:1.5px solid #2a3a5c;border-radius:8px;color:#cfe0ff;font-size:16px;font-weight:700;background:linear-gradient(180deg,#2a3a5c,#1a2540);cursor:pointer}.pad button:active{color:#7ee8b0;border-color:#7ee8b0}.pad .ok{color:#06210f;border-color:#7ee8b0;background:linear-gradient(180deg,#8ff5bd,#48c98a)}</style></head><body>
<div class="hud"><span>Ур.<b id="lv">1</b></span><span>Врагов<b id="en">0</b></span><span>💣<b id="bm">1</b></span><span>💰<b id="coins">0</b></span></div>
<div class="wrap"><canvas id="c" width="380" height="380"></canvas><div class="msg" id="msg"></div></div>
<div class="pad" id="pad"></div>
<script>(function(){const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');
const S=13,CELL=c.width/S;
let player,enemies,bombs,blast,blocks,alive,level,bombCount,maxBombs,bombPower;
let totalCoins=Number(localStorage.getItem('bomber_coins')||0);
function init(){player={x:1,y:1};enemies=[];bombs=[];blast=[];blocks=[];
for(let y=0;y<S;y++)for(let x=0;x<S;x++){if(x===0||y===0||x===S-1||y===S-1){blocks.push({x,y,hard:true});continue;}if((x%2===0)&&(y%2===0)){blocks.push({x,y,hard:true});continue;}if(x<3&&y<3)continue;if(Math.random()<0.35)blocks.push({x,y,hard:false});}
const ec=1+Math.min(level,4);
for(let i=0;i<ec;i++){let pos;do{pos={x:S-2-Math.floor(Math.random()*3),y:S-2-Math.floor(Math.random()*3)};}while(blocks.some(b=>b.x===pos.x&&b.y===pos.y)||(Math.abs(pos.x-player.x)+Math.abs(pos.y-player.y))<6||enemies.some(e=>e.x===pos.x&&e.y===pos.y));enemies.push({...pos,alive:true,dir:{x:0,y:0},timer:0});}
bombs=[];blast=[];alive=true;bombCount=1;maxBombs=1+Math.floor(level/3);bombPower=2+Math.floor(level/5);render();}
function show(t,p,b,n){const m=$('msg');m.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';m.classList.add('show');const bt=document.createElement('button');bt.textContent=b;bt.onclick=()=>{m.classList.remove('show');n();};m.appendChild(bt);}
function placeBomb(){if(!alive)return;if(bombs.filter(b=>b.owner==='p').length>=maxBombs)return;if(bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,timer:2500,owner:'p',power:bombPower});}
function explode(b){const cells=[];cells.push({x:b.x,y:b.y});
for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){for(let i=1;i<=b.power;i++){const x=b.x+d[0]*i,y=b.y+d[1]*i;const bl=blocks.find(bb=>bb.x===x&&bb.y===y);if(bl){if(!bl.hard){blocks.splice(blocks.indexOf(bl),1);cells.push({x,y});}break;}cells.push({x,y});}}
for(const c2 of cells){blast.push({x:c2.x,y:c2.y,end:performance.now()+350});
if(c2.x===player.x&&c2.y===player.y){alive=false;show('💥 Ты взорвался!','Уровень: '+level,'Заново',()=>{level=1;localStorage.setItem('bomber_lv',1);init();});return;}
enemies.forEach(e=>{if(e.alive&&e.x===c2.x&&e.y===c2.y)e.alive=false;});}}
function move(dx,dy){if(!alive)return;const nx=player.x+dx,ny=player.y+dy;if(nx<0||ny<0||nx>=S||ny>=S)return;if(blocks.some(b=>b.x===nx&&b.y===ny))return;if(bombs.some(b=>b.x===nx&&b.y===ny))return;player={x:nx,y:ny};render();}
function step(dt){if(!alive)return;
const now=performance.now();
for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];b.timer-=dt;if(b.timer<=0){explode(b);bombs.splice(i,1);}}
blast=blast.filter(bl=>bl.end>now);
// ИИ врагов
for(const e of enemies){if(!e.alive)continue;e.timer-=dt;if(e.timer<=0){e.timer=800;
const dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>{const nx=e.x+d[0],ny=e.y+d[1];return nx>0&&ny>0&&nx<S-1&&ny<S-1&&!blocks.some(b=>b.x===nx&&b.y===ny)&&!bombs.some(b=>b.x===nx&&b.y===ny);});
if(dirs.length){if(Math.random()<0.3){e.dir=dirs[Math.floor(Math.random()*dirs.length)];}
else{let best=null;for(const d of dirs){const nx=e.x+d[0],ny=e.y+d[1];const dist=Math.abs(nx-player.x)+Math.abs(ny-player.y);if(!best||dist<best.d)best={d,d:dist};}if(best)e.dir=best.d;}}
const nx=e.x+e.dir.x,ny=e.y+e.dir.y;if(nx>0&&ny>0&&nx<S-1&&ny<S-1&&!blocks.some(b=>b.x===nx&&b.y===ny)&&!bombs.some(b=>b.x===nx&&b.y===ny)){e.x=nx;e.y=ny;}}
if(blast.some(bl=>bl.x===e.x&&bl.y===e.y))e.alive=false;
if(e.x===player.x&&e.y===player.y){alive=false;show('💀 Враг поймал!','Уровень: '+level,'Заново',()=>{level=1;localStorage.setItem('bomber_lv',1);init();});return;}
}
if(enemies.filter(e=>e.alive).length===0){const r=30+level*15;totalCoins+=r;localStorage.setItem('bomber_coins',totalCoins);try{window.parent.postMessage({type:'addCoins',amount:r},'*');}catch(e){}level++;localStorage.setItem('bomber_lv',level);show('🎉 Уровень пройден!','+'+r+'💰','Дальше',init);}}
function render(){ctx.fillStyle='#050a14';ctx.fillRect(0,0,c.width,c.height);
for(let y=0;y<S;y++)for(let x=0;x<S;x++){ctx.fillStyle=(x+y)%2?'rgba(255,255,255,.02)':'rgba(255,255,255,.04)';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);}
for(const b of blocks){if(b.hard){ctx.fillStyle='#22304d';ctx.fillRect(b.x*CELL+1,b.y*CELL+1,CELL-2,CELL-2);ctx.fillStyle='#3a4a6d';ctx.fillRect(b.x*CELL+2,b.y*CELL+2,CELL-4,CELL-4);}else{ctx.fillStyle='#5a4a2a';ctx.fillRect(b.x*CELL+1,b.y*CELL+1,CELL-2,CELL-2);ctx.fillStyle='#8a6a3a';ctx.fillRect(b.x*CELL+3,b.y*CELL+3,CELL-6,CELL-6);}}
for(const bl of blast){ctx.fillStyle='rgba(255,180,50,.7)';ctx.fillRect(bl.x*CELL,bl.y*CELL,CELL,CELL);}
for(const b of bombs){ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(b.x*CELL+CELL/2,b.y*CELL+CELL/2,CELL*0.35,0,7);ctx.fill();ctx.fillStyle='#ff5757';ctx.beginPath();ctx.arc(b.x*CELL+CELL*0.7,b.y*CELL+CELL*0.25,CELL*0.1,0,7);ctx.fill();}
for(const e of enemies){if(!e.alive)continue;ctx.fillStyle='#ff8a65';ctx.beginPath();ctx.arc(e.x*CELL+CELL/2,e.y*CELL+CELL/2,CELL*0.35,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x*CELL+CELL*0.35,e.y*CELL+CELL*0.4,CELL*0.08,0,7);ctx.arc(e.x*CELL+CELL*0.65,e.y*CELL+CELL*0.4,CELL*0.08,0,7);ctx.fill();}
ctx.fillStyle='#7ee8b0';ctx.beginPath();ctx.arc(player.x*CELL+CELL/2,player.y*CELL+CELL/2,CELL*0.4,0,7);ctx.fill();ctx.fillStyle='#06210f';ctx.beginPath();ctx.arc(player.x*CELL+CELL*0.35,player.y*CELL+CELL*0.4,CELL*0.08,0,7);ctx.arc(player.x*CELL+CELL*0.65,player.y*CELL+CELL*0.4,CELL*0.08,0,7);ctx.fill();
$('lv').textContent=level;$('en').textContent=enemies.filter(e=>e.alive).length;$('bm').textContent=maxBombs;$('coins').textContent=totalCoins;}
let last=0;function loop(t){if(!alive)return;const dt=Math.min(t-last,50);last=t;step(dt);render();requestAnimationFrame(loop);}
const pad=$('pad');[{},{l:'▲',d:[0,-1]},{l:'💣',a:'bomb'},{l:'◀',d:[-1,0]},{l:'OK',ok:1},{l:'▶',d:[1,0]},{},{l:'▼',d:[0,1]},{}].forEach(it=>{if(!it.l&&!it.d&&!it.a&&!it.ok){pad.appendChild(document.createElement('button'));return;}const b=document.createElement('button');b.textContent=it.l||'';if(it.ok)b.className='ok';b.addEventListener('click',()=>{if(it.a==='bomb')placeBomb();else if(it.d)move(it.d[0],it.d[1]);else if(it.ok&&!alive)init();});pad.appendChild(b);});
document.addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key];if(m){e.preventDefault();move(m[0],m[1]);}else if(e.key===' '){e.preventDefault();placeBomb();}});
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='input'){const m={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};if(m[d.act])move(m[d.act][0],m[d.act][1]);else if(d.act==='ok'||d.act==='a')placeBomb();else if(d.act==='back')try{window.parent.postMessage({type:'exit'},'*');}catch(e){}}});
level=Number(localStorage.getItem('bomber_lv')||1);init();requestAnimationFrame(loop);})();</script></body></html>
